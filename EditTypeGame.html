<!doctype html><html lang="vi"><head><title>Vân Giáp – Admin: Hệ nguyên tố</title><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><link rel="stylesheet" href="vg-admin.css?v=202611261">
<script src="vg-admin.js?v=202611263" defer></script>
<style>
/* Trang này chỉ thêm các lớp riêng cho hệ nguyên tố; màu/phông chung vẫn lấy từ vg-admin.css */
body.ed{max-width:980px}
.echip{display:inline-block;padding:1px 8px;border-radius:10px;border:1px solid var(--ec,#888);color:var(--tx);background:color-mix(in srgb,var(--ec,#888) 22%,transparent);font-size:12px;margin:0 3px 3px 0;white-space:nowrap}
.ecard{border:2px solid var(--ec);border-radius:8px;padding:10px;margin-bottom:10px;background:linear-gradient(90deg,color-mix(in srgb,var(--ec) 16%,var(--card)),var(--card) 60%)}
.ecard h3{margin:0;font-size:16px;color:var(--ec);filter:brightness(.85)}
.fxb{border-left:4px solid var(--ec);padding:6px 8px;margin-top:8px;background:var(--bg);border-radius:0 6px 6px 0}
.fxb b{font-size:14px}.fxb .p{font-size:12px;color:var(--mut);margin:2px 0}
.cat{display:inline-block;font-size:11px;padding:0 7px;border-radius:9px;background:var(--bd);margin-left:4px}
.eng{font-size:11px;padding:0 7px;border-radius:9px;color:#fff;margin-left:4px}.eng.ready{background:var(--ok)}.eng.mapped{background:#b8892f}.eng.needs{background:var(--red)}
.pg{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:4px}.pg label{margin:0}
.wheel{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:12px;align-items:start}
@media(max-width:720px){.wheel{grid-template-columns:1fr}.pg{grid-template-columns:repeat(2,1fr)}}
.leg{background:#0b1226;color:#f3e7c9;border:2px solid #c9a24a;border-radius:8px;padding:10px}.leg div{display:flex;align-items:center;gap:8px;margin:4px 0;font-size:13px}.leg i{display:inline-block;width:38px;height:0;border-top:4px solid;position:relative}
.mx{border-collapse:collapse;font-size:11px;min-width:560px}.mx th,.mx td{border:1px solid var(--bd);text-align:center;padding:0;min-width:40px;height:34px}.mx td{cursor:pointer;font-weight:700}.mx th{position:sticky;left:0;background:var(--card);font-size:11px;padding:0 3px}
.mx .s{background:#3df06a44;color:#157a35}.mx .w{background:#ff6a4a33;color:#a0301a}.mx .d{color:var(--bd)}.mx .self{background:var(--bg);cursor:default}
.bad{color:var(--red)}.good{color:var(--ok)}
.banner{border:2px solid;border-radius:6px;padding:8px 10px;margin-bottom:10px;font-size:13px}.banner.pr{border-color:#b8892f;background:#b8892f22}.banner.ap{border-color:var(--ok);background:#4b7a5222}
.rg{display:grid;grid-template-columns:repeat(6,1fr);gap:4px}@media(max-width:720px){.rg{grid-template-columns:repeat(3,1fr)}}.rg label{font-size:11px;margin:0}
.eqrow .dot{width:10px;height:10px;border-radius:50%;display:inline-block;margin-right:4px;vertical-align:middle;border:1px solid #0004}
</style></head><body class="ed">
<h1>🔮 Vân Giáp – Admin: Hệ nguyên tố</h1>
<div class="card mu" id="src">Đang tải dữ liệu…</div>
<div class="tabs" id="tabs"><button data-t="map" class="on">Sơ đồ khắc chế</button><button data-t="fx">12 hệ &amp; 24 hiệu ứng</button><button data-t="mx">Ma trận &amp; Audit</button><button data-t="eq">Gắn lên trang bị</button></div>
<div id="main"></div>
<div class="card">
<h2>Đồng bộ</h2>
<label>Token GitHub (chỉ lưu tạm trong phiên, không ghi vào code)</label><input id="tk" type="password" placeholder="ghp_… hoặc github_pat_…" autocomplete="off">
<div class="row" style="margin-top:8px"><button class="btn" id="bUp">⬆ Lưu LÊN GitHub</button><button class="btn g" id="bDn">⬇ Lấy TỪ GitHub</button><button class="btn g" id="bEx">Tải 2 JSON xuống</button></div>
<div id="msg"></div>

</div>
<script src="vg-github.js?v=202611263"></script><script src="vg-element.js?v=1"></script>
<script>
(function(){
var $=function(i){return document.getElementById(i)},E=VG.element,esc=E.esc;
var tab='map',selEl='',selEq='',slotF='',EQ=[],dEl=false,dEq=false,SLOTS={head:'Đầu',body:'Thân',shoulder:'Vai',arm:'Tay',glove:'Găng',leg:'Chân',boot:'Giày',weapon:'Vũ khí',backpack:'Ba lô',wing:'Cánh',pet:'Pet',drone:'Drone'};
function msg(t,ok){var m=$('msg');m.textContent=t;m.className=ok?'ok':'er'}
function dirtyEl(){dEl=true}function dirtyEq(){dEq=true}
function pnum(v,lo,hi){v=+v;if(!isFinite(v))v=0;return Math.max(lo,Math.min(hi,v))}
/* ---------- Tab 1: Sơ đồ ---------- */
function viewMap(){
 var S=E.M(),st=E.D.matrix,h='<div class="banner '+(st.approved?'ap':'pr')+'">'+(st.approved?'✔ Ma trận ĐÃ DUYỆT'+(st.approvedAt?' ('+esc(st.approvedAt)+')':''):'⚠ Ma trận đang ở dạng ĐỀ XUẤT – chưa được chủ dự án duyệt. Xem tab “Ma trận &amp; Audit”.')+'</div>';
 h+='<div class="chips">'+E.ids().map(function(id){var e=E.by[id];return '<button data-el="'+id+'" class="'+(id==selEl?'on':'')+'" style="border-color:'+e.color+'">'+esc(e.icon)+' '+esc(e.name)+'</button>'}).join('')+'<button data-el="">Bỏ chọn</button></div>';
 h+='<div class="wheel"><div id="wh">'+E.wheelSVG({sel:selEl})+'</div><div><div class="leg"><div><i style="border-color:#3df06a"></i>Khắc chế mạnh (×'+E.rule().strong+')</div><div><i style="border-color:#4aa8ff"></i>Bình thường (×'+E.rule().normal+')</div><div><i style="border-color:#ff6a4a"></i>Bị khắc chế (×'+E.rule().weak+')</div></div>';
 if(selEl){var e=E.by[selEl],b=E.beats(selEl),bb=E.beatenBy(selEl),nm=E.ids().filter(function(x){return x!=selEl&&b.indexOf(x)<0&&bb.indexOf(x)<0});
  h+='<div class="card" style="margin-top:10px;border-color:'+e.color+'"><h2>'+esc(e.icon)+' '+esc(e.name)+' <span class="mu">· '+esc(e.role)+'</span></h2><p>'+esc(e.desc)+'</p><label>Khắc chế mạnh ×'+E.rule().strong+'</label><div>'+b.map(E.chipHtml).join('')+'</div><label>Bị khắc chế ×'+E.rule().weak+'</label><div>'+bb.map(E.chipHtml).join('')+'</div><label>Bình thường ×'+E.rule().normal+'</label><div>'+nm.map(E.chipHtml).join('')+'</div><label>Hiệu ứng đặc trưng</label>'+E.effectsOf(selEl).map(function(f){return '<div class="fxb" style="--ec:'+e.color+'"><b>'+esc(f.name)+' – '+esc(f.vi)+'</b><div class="p">'+esc(E.fmtFx(f))+'</div></div>'}).join('')+'</div>'}
 else h+='<div class="card mu" style="margin-top:10px">Chạm vào một hệ trên sơ đồ để xem: 2 hệ nó khắc chế (xanh lá), 2 hệ khắc chế nó (đỏ), 7 hệ còn lại (xanh dương). Chưa chọn: sơ đồ hiện 24 quan hệ “A khắc chế B”. Sơ đồ vẽ trực tiếp từ ma trận trong <code>elements.json</code>.</div>';
 h+='</div></div>';$('main').innerHTML=h}
/* ---------- Tab 2: 12 hệ & 24 hiệu ứng ---------- */
function pf(l,p,v,st){return '<label>'+l+'<input type="number" step="'+(st||1)+'" data-fx="'+p+'" value="'+esc(v)+'"></label>'}
function viewFx(){
 var h='<div class="card mu">Thông số hiệu ứng là <b>đề xuất cân bằng</b> (<code>proposed:true</code>). Sửa số trực tiếp rồi bấm “Lưu”. Nhãn: <span class="eng ready">ready</span> chỉ số đã có trong game · <span class="eng mapped">mapped</span> ánh xạ vào chỉ số hiện có / cần hook combat · <span class="eng needs">needs</span> game chưa có hệ thống tương ứng (chưa nối, không tạo giả).</div>';
 E.ids().forEach(function(id){var e=E.by[id];
  h+='<div class="ecard" style="--ec:'+e.color+'"><h3>'+esc(e.icon)+' '+esc(e.name)+' – '+esc(e.role)+'</h3><div class="row" style="margin-top:6px"><div class="fix"><label>Màu<input type="color" data-ec="'+id+'" value="'+esc(e.color)+'" style="padding:0;height:36px;width:60px"></label></div><div><label>Mô tả hệ<input data-ed="'+id+'" value="'+esc(e.desc)+'"></label></div></div>';
  E.effectsOf(id).forEach(function(f){
   h+='<div class="fxb" style="--ec:'+e.color+'"><b>'+esc(f.name)+' – '+esc(f.vi)+'</b><span class="cat">'+esc(f.category)+'</span><span class="cat">'+esc(f.domain)+'</span><span class="eng '+f.engine+'">'+f.engine+'</span>'+(f.ccGroup?'<span class="cat">'+esc(f.ccGroup)+'</span>':'')+'<div style="margin-top:4px">'+esc(f.desc)+'</div>'+
    '<div class="pg">'+pf('Thời hạn (lượt)',f.id+'|duration',f.duration)+pf('Xác suất (%)',f.id+'|chance',f.chance)+pf('Tầng tối đa',f.id+'|stackLimit',f.stackLimit)+pf('Giá trị',f.id+'|value',f.value,'any')+'</div>'+
    '<div class="p">Đơn vị giá trị: '+esc(f.unit||'—')+(f.stat?' · chỉ số: '+esc(f.stat):'')+(f.tick?' · tick: cuối lượt':'')+' · Kháng: '+esc(f.resistType)+' · '+(f.cleanseable?'Thanh tẩy được':'Không thanh tẩy')+' · PvP: xác suất ×'+f.pvp.chanceMult+', thời hạn ×'+f.pvp.durationMult+', giá trị ×'+f.pvp.valueMult+'</div>'+(f.diminishing?'<div class="p">Giảm dần/miễn nhiễm: '+esc(f.diminishing)+'</div>':'')+(f.note?'<div class="p bad">'+esc(f.note)+'</div>':'')+'</div>'});
  h+='</div>'});
 $('main').innerHTML=h}
/* ---------- Tab 3: Ma trận & Audit ---------- */
function viewMx(){
 var S=E.M(),ids=E.ids(),R=E.rule(),a=E.audit(S,null),o=E.D.matrixOriginal,ao=E.audit(o.strong,o.beatenBy),h='';
 h+='<div class="card"><h2>Ma trận 12×12 (hàng = hệ tấn công, cột = hệ phòng thủ)</h2><div class="mu" style="margin-bottom:6px">Chạm ô để đổi: ô trống → thêm “hàng khắc chế cột”; ô xanh/đỏ → gỡ quan hệ đó. “Bị khắc chế” tự suy ra từ cùng danh sách nên luôn đối xứng.</div><div class="box"><table class="mx"><tr><th></th>'+ids.map(function(c){return '<th style="color:'+E.color(c)+'">'+esc(E.by[c].icon)+'</th>'}).join('')+'</tr>';
 ids.forEach(function(r){h+='<tr><th style="text-align:left;color:'+E.color(r)+'">'+esc(E.by[r].icon)+' '+esc(E.by[r].name)+'</th>'+ids.map(function(c){if(r==c)return '<td class="self">–</td>';var m=E.mult(r,c);return '<td data-r="'+r+'" data-c="'+c+'" class="'+(m==R.strong?'s':m==R.weak?'w':'d')+'">'+(m==R.strong?'×'+R.strong:m==R.weak?'×'+R.weak:'·')+'</td>'}).join('')+'</tr>'});
 h+='</table></div></div>';
 h+='<div class="card"><h2>Audit ma trận đang dùng</h2>'+(a.ok?'<div class="good">✔ Đạt: mỗi hệ khắc chế đúng 2 và bị đúng 2 hệ khắc chế; không có quan hệ khắc lẫn nhau.</div>':a.issues.map(function(x){return '<div class="bad">✘ '+esc(x)+'</div>'}).join(''))+
  '<div class="mu" style="margin-top:6px">Tổng: '+ids.reduce(function(n,x){return n+(S[x]||[]).length},0)+' quan hệ khắc chế (chuẩn = 24).</div></div>';
 h+='<div class="card"><h2>Đối chiếu bảng gốc của prompt</h2>'+(ao.ok&&!ao.diff.length?'<div class="good">✔ Bảng gốc hợp lệ.</div>':'<div class="bad">Bảng gốc KHÔNG đối xứng: cột “bị khắc chế” không khớp với cột “khắc chế” ở '+ao.diff.length+' hệ, và '+ao.issues.length+' lỗi đếm.</div>')+
  ao.diff.map(function(d){return '<div style="margin:4px 0">'+E.chipHtml(d.el)+' bảng ghi bị khắc bởi <b>'+d.declared.map(E.name).join(', ')+'</b> · suy ra từ cột khắc chế: <b>'+d.derived.map(E.name).join(', ')+'</b></div>'}).join('')+
  '<h3>Thay đổi AI đề xuất (so với bảng gốc)</h3>'+E.D.matrixProposed.changes.map(function(c){return '<div class="sub"><b>'+esc(E.name(c.attacker))+'</b>: bỏ “khắc '+esc(E.name(c.remove))+'”, thêm “khắc '+esc(E.name(c.add))+'”<div class="mu">'+esc(c.why)+'</div></div>'}).join('')+
  '<div class="row"><button class="btn g s" data-mx="proposed">Nạp bản cân bằng đề xuất</button><button class="btn g s" data-mx="original">Nạp bảng gốc (để thử)</button></div></div>';
 h+='<div class="card"><h2>Duyệt</h2><div class="mu">Chỉ duyệt khi audit đạt. Sửa ma trận sau khi duyệt sẽ tự bỏ trạng thái duyệt.</div><div class="row" style="margin-top:6px"><button class="btn" data-mx="approve" '+(a.ok&&!E.D.matrix.approved?'':'disabled')+'>✔ Duyệt ma trận này</button><button class="btn g" data-mx="unapprove" '+(E.D.matrix.approved?'':'disabled')+'>Bỏ duyệt</button></div></div>';
 $('main').innerHTML=h}
function mxSet(S){E.D.matrix.strong=S;E.D.matrix.approved=false;E.D.matrix.status='proposed';E.D.matrix.approvedAt='';dirtyEl();viewMx()}
/* ---------- Tab 4: Gắn lên trang bị ---------- */
function eqOf(id){return EQ.filter(function(x){return x.id==id})[0]}
function tagSummary(t){if(!t||!t.el)return '';var s=E.chipHtml(t.el)+(t.el2?E.chipHtml(t.el2):'');(t.fx||[]).forEach(function(f){s+='<span class="cat">'+esc((E.fx[f]||{}).name||f)+'</span>'});return s}
function viewEq(){
 var h='<div class="card mu">Trang bị lấy từ <code>database/mecha-studio.json › equips</code> (chỉ đọc). Gắn hệ được lưu riêng vào <code>equip-elements.json</code>. Trang bị chưa gắn = không hệ (Non type). Không có trang bị nào được tự gán hệ.</div>';
 if(!EQ.length){$('main').innerHTML=h+'<div class="card er">Không đọc được danh sách trang bị từ database/mecha-studio.json.</div>';return}
 var slots=Object.keys(SLOTS).filter(function(s){return EQ.some(function(x){return x.slot==s})});
 h+='<div class="chips"><button data-sl="" class="'+(slotF?'':'on')+'">Tất cả ('+EQ.length+')</button>'+slots.map(function(s){return '<button data-sl="'+s+'" class="'+(slotF==s?'on':'')+'">'+SLOTS[s]+' ('+EQ.filter(function(x){return x.slot==s}).length+')</button>'}).join('')+'</div>';
 h+='<div class="card">'+EQ.filter(function(x){return !slotF||x.slot==slotF}).map(function(x){var t=E.tag(x.id);return '<div class="li eqrow'+(x.id==selEq?' sel':'')+'" data-eq="'+esc(x.id)+'"><span><b>'+esc(x.name||x.id)+'</b> <span class="tag">'+esc(SLOTS[x.slot]||x.slot)+'</span>'+(x.set?'<span class="tag">'+esc(x.set)+'</span>':'')+'</span><span>'+(t&&t.el?tagSummary(t):'<span class="mu">Non type</span>')+'</span></div>'}).join('')+'</div>';
 var orph=Object.keys(E.T.tags||{}).filter(function(i){return !eqOf(i)});
 if(orph.length)h+='<div class="card er">Gắn hệ cho ID không còn trong database: '+orph.map(function(i){return esc(i)+' <button class="btn r s" data-orph="'+esc(i)+'">Xóa</button>'}).join(' · ')+'</div>';
 var q=selEq&&eqOf(selEq);if(q)h+=eqForm(q);
 $('main').innerHTML=h}
function eqForm(q){
 var t=E.tag(q.id)||{},role=E.role(q.slot),el=t.el||'',el2=t.el2||'',h='<div class="card" id="eqf"><h2>'+esc(q.name||q.id)+' <span class="tag">'+esc(SLOTS[q.slot]||q.slot)+'</span></h2>';
 if(role=='pet')h+='<div class="mu">Trường cũ <code>dmgType</code> ('+esc(q.dmgType||'—')+') được giữ nguyên trong mecha-studio.json; hệ gắn ở đây sẽ thay thế khi combat đọc <code>equip-elements.json</code>.</div>';
 var opt=function(v,sel){return '<option value="">'+(v?'Không':'Không hệ (Non type)')+'</option>'+E.ids().map(function(i){return '<option value="'+i+'"'+(i==sel?' selected':'')+'>'+esc(E.by[i].icon)+' '+esc(E.by[i].name)+'</option>'}).join('')};
 h+='<div class="row"><div><label>Hệ chính</label><select data-f="el">'+opt(0,el)+'</select></div>'+(role=='weapon'?'<div><label>Hệ phụ (vũ khí)</label><select data-f="el2">'+opt(1,el2)+'</select></div><div><label>Tỉ lệ hệ chính (%)</label><input type="number" min="1" max="100" data-f="ratio" value="'+esc(t.ratio||100)+'"></div>':'')+'</div>';
 var fxs=[];[el,el2].forEach(function(e){if(e)E.effectsOf(e).forEach(function(f){fxs.push(f)})});
 h+='<label>Hiệu ứng đặc trưng (chỉ chọn trong hệ đã gắn)</label><div class="ck">'+(fxs.length?fxs.map(function(f){return '<label style="border-color:'+E.color(f.element)+'"><input type="checkbox" data-fx2="'+f.id+'"'+((t.fx||[]).indexOf(f.id)>=0?' checked':'')+'>'+esc(E.by[f.element].icon)+' '+esc(f.name)+' – '+esc(f.vi)+'</label>'}).join(''):'<span class="mu">Chọn hệ trước.</span>')+'</div>';
 fxs.forEach(function(f){if((t.fx||[]).indexOf(f.id)>=0)h+='<div class="mu">• '+esc(f.name)+': '+esc(f.desc)+' <b>('+esc(E.fmtFx(f))+')</b></div>'});
 h+='<div class="row" style="margin-top:8px"><div><label>Xác suất gây hiệu ứng (%) – trống = mặc định</label><input type="number" min="0" max="100" data-f="chance" value="'+(t.chance==null?'':esc(t.chance))+'"></div>'+
  (role=='part'||role=='weapon'?'<div><label>Sát thương hệ cộng thêm (%)</label><input type="number" min="0" max="200" data-f="dmgBonus" value="'+esc(t.dmgBonus||0)+'"></div><div><label>Xuyên kháng hệ (%)</label><input type="number" min="0" max="100" data-f="pen" value="'+esc(t.pen||0)+'"></div>':'')+'</div>';
 if(role=='part')h+='<div class="row"><div><label>Kháng hiệu ứng (%)</label><input type="number" min="0" max="100" data-f="statusResist" value="'+esc(t.statusResist||0)+'"></div><div><label>Giảm thời hạn hiệu ứng xấu (%)</label><input type="number" min="0" max="100" data-f="durRed" value="'+esc(t.durRed||0)+'"></div></div><details open><summary>Kháng sát thương theo hệ (%) – từ −50 đến 75</summary><div class="rg">'+E.ids().map(function(i){return '<label style="color:'+E.color(i)+'">'+esc(E.by[i].icon)+' '+esc(E.by[i].name)+'<input type="number" min="-50" max="75" data-rs="'+i+'" value="'+esc((t.resist||{})[i]||0)+'"></label>'}).join('')+'</div></details>';
 if(el){var b=E.beats(el),bb=E.beatenBy(el);h+='<div class="mu" style="margin-top:8px">Hệ chính '+esc(E.name(el))+' khắc: '+b.map(E.name).join(', ')+' · yếu trước: '+bb.map(E.name).join(', ')+'</div>'}
 var er=E.checkTag(t);if(er.length)h+=er.map(function(x){return '<div class="er">✘ '+esc(x)+'</div>'}).join('');
 h+='<div class="row" style="margin-top:8px"><button class="btn r s" data-clr="1">Xóa gắn hệ của trang bị này</button></div></div>';return h}
function tagOf(id){var T=E.T.tags=E.T.tags||{};return T[id]||(T[id]={})}
function cleanTag(id){var t=E.T.tags[id];if(!t)return;['el2','chance','ratio','dmgBonus','pen','statusResist','durRed'].forEach(function(k){if(t[k]===''||t[k]==null||(k!='chance'&&+t[k]===0)||(k=='ratio'&&+t[k]===100))delete t[k]});
 if(t.resist){Object.keys(t.resist).forEach(function(k){if(!+t.resist[k])delete t.resist[k]});if(!Object.keys(t.resist).length)delete t.resist}
 if(!t.el){delete E.T.tags[id];return}
 t.fx=(t.fx||[]).filter(function(f){var d=E.fx[f];return d&&(d.element==t.el||d.element==t.el2)});if(!t.fx.length)delete t.fx}
/* ---------- Điều hướng & sự kiện ---------- */
function render(){[].forEach.call($('tabs').children,function(b){b.className=b.dataset.t==tab?'on':''});({map:viewMap,fx:viewFx,mx:viewMx,eq:viewEq})[tab]()}
document.addEventListener('click',function(e){var t=e.target.closest('button,g.wn,td[data-r],.li[data-eq]');if(!t)return;
 if(t.dataset.t){tab=t.dataset.t;render();return}
 if(t.classList&&t.classList.contains('wn')){selEl=selEl==t.dataset.el?'':t.dataset.el;viewMap();return}
 if(t.dataset.el!==undefined&&t.tagName=='BUTTON'){selEl=t.dataset.el;viewMap();return}
 if(t.dataset.r){var r=t.dataset.r,c=t.dataset.c,S=JSON.parse(JSON.stringify(E.M())),m=E.mult(r,c);
  if(m==E.rule().strong)S[r]=S[r].filter(function(x){return x!=c});else if(m==E.rule().weak)S[c]=S[c].filter(function(x){return x!=r});else{S[r]=S[r]||[];S[r].push(c)}mxSet(S);return}
 if(t.dataset.mx){var k=t.dataset.mx;if(k=='proposed')mxSet(JSON.parse(JSON.stringify(E.D.matrixProposed.strong)));else if(k=='original')mxSet(JSON.parse(JSON.stringify(E.D.matrixOriginal.strong)));
  else if(k=='approve'){if(!confirm('Duyệt ma trận khắc chế hiện tại làm bản chính thức?'))return;E.D.matrix.approved=true;E.D.matrix.status='approved';E.D.matrix.approvedAt=new Date().toISOString().slice(0,10);dirtyEl();viewMx()}
  else if(k=='unapprove'){E.D.matrix.approved=false;E.D.matrix.status='proposed';E.D.matrix.approvedAt='';dirtyEl();viewMx()}return}
 if(t.dataset.sl!==undefined&&t.tagName=='BUTTON'){slotF=t.dataset.sl;viewEq();return}
 if(t.dataset.eq){selEq=selEq==t.dataset.eq?'':t.dataset.eq;viewEq();return}
 if(t.dataset.orph){delete E.T.tags[t.dataset.orph];dirtyEq();viewEq();return}
 if(t.dataset.clr){if(!confirm('Xóa gắn hệ của trang bị này?'))return;delete E.T.tags[selEq];dirtyEq();viewEq();msg('Đã xóa (chưa lưu lên GitHub).',1)}});
document.addEventListener('input',function(e){var t=e.target;
 if(t.dataset.fx){var p=t.dataset.fx.split('|'),f=E.fx[p[0]];if(f){f[p[1]]=pnum(t.value,0,p[1]=='chance'?100:p[1]=='stackLimit'?20:p[1]=='duration'?20:9999);f.proposed=true;dirtyEl()}}
 else if(t.dataset.ec){E.by[t.dataset.ec].color=t.value;dirtyEl()}
 else if(t.dataset.ed){E.by[t.dataset.ed].desc=t.value;dirtyEl()}
 else if(t.dataset.rs&&selEq){var tg=tagOf(selEq);tg.resist=tg.resist||{};tg.resist[t.dataset.rs]=pnum(t.value,-50,75);dirtyEq()}
 else if(t.dataset.f&&t.tagName=='INPUT'&&selEq){var g=tagOf(selEq),k=t.dataset.f;g[k]=t.value===''?'':pnum(t.value,0,k=='dmgBonus'?200:100);dirtyEq()}});
document.addEventListener('change',function(e){var t=e.target;
 if(t.dataset.f&&t.tagName=='SELECT'&&selEq){var g=tagOf(selEq),k=t.dataset.f;g[k]=t.value;
  if(k=='el2'&&t.value&&t.value==g.el){g.el2='';msg('Hệ phụ phải khác hệ chính.',0)}
  if(k=='el'&&!t.value)delete E.T.tags[selEq];else cleanTag(selEq);dirtyEq();viewEq()}
 else if(t.dataset.fx2&&selEq){var g2=tagOf(selEq);g2.fx=g2.fx||[];var i=g2.fx.indexOf(t.dataset.fx2);if(t.checked&&i<0)g2.fx.push(t.dataset.fx2);if(!t.checked&&i>=0)g2.fx.splice(i,1);dirtyEq();viewEq()}
 else if(t.dataset.f&&t.tagName=='INPUT'&&selEq){cleanTag(selEq);viewEq()}});
/* ---------- Đồng bộ ---------- */
function clone(o){return JSON.parse(JSON.stringify(o))}
function pre(){Object.keys(E.T.tags||{}).forEach(function(i){if(!E.T.tags[i].el)delete E.T.tags[i]});var a=E.audit(E.M(),null);if(E.D.matrix.approved&&!a.ok)return 'Ma trận đã đánh dấu duyệt nhưng audit không đạt: '+a.issues[0];
 var bad=[];Object.keys(E.T.tags||{}).forEach(function(i){E.checkTag(E.T.tags[i]).forEach(function(x){bad.push(i+': '+x)})});return bad.length?'Gắn hệ trang bị lỗi — '+bad[0]:''}
$('tk').value=VG.getToken();
$('bUp').onclick=function(){var p=pre();if(p)return msg('Không lưu được: '+p,0);var tk=$('tk').value.trim();if(!tk)return msg('Chưa nhập token GitHub.',0);
 if(!dEl&&!dEq)return msg('Không có thay đổi để lưu.',0);if(!confirm('Ghi lên GitHub '+(dEl?'database/elements.json ':'')+(dEq?'database/equip-elements.json':'')+'?'))return;
 VG.setToken(tk);msg('Đang lưu lên GitHub…',1);var jobs=[];
 if(dEl)jobs.push(function(){return VG.save(E.PATH.el,E.D,'Cập nhật hệ nguyên tố (EditTypeGame)')});
 if(dEq)jobs.push(function(){return VG.save(E.PATH.eq,E.T,'Cập nhật gắn hệ trang bị (EditTypeGame)')});
 jobs.reduce(function(pr,f){return pr.then(f)},Promise.resolve()).then(function(){dEl=dEq=false;msg('✔ Thành công: đã lưu lên GitHub.',1)}).catch(function(e){msg('✘ Thất bại: '+e.message+' (token cần quyền Contents: write).',0)})};
$('bDn').onclick=function(){if((dEl||dEq)&&!confirm('Có thay đổi chưa lưu. Lấy từ GitHub sẽ ghi đè?'))return;
 Promise.all([VG.fetchJSON(E.PATH.el),VG.fetchJSON(E.PATH.eq)]).then(function(a){if(!a[0]||!a[0].elements)throw Error('Chưa có database/elements.json trên GitHub');E.setData(a[0]);E.setTags(a[1]);dEl=dEq=false;render();msg('✔ Đã lấy dữ liệu từ GitHub.',1)}).catch(function(e){msg('✘ Thất bại: '+e.message,0)})};
$('bEx').onclick=function(){[['elements.json',E.D],['equip-elements.json',E.T]].forEach(function(x,i){setTimeout(function(){var a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(x[1],null,1)],{type:'application/json'}));a.download=x[0];a.click()},i*400)});msg('✔ Đã tải 2 file xuống máy.',1)};
window.addEventListener('beforeunload',function(e){if(dEl||dEq){e.preventDefault();e.returnValue=''}});
/* ---------- Khởi động ---------- */
E.load().then(function(){$('src').textContent='Đã đọc database/elements.json: '+E.D.elements.length+' hệ, '+E.D.effects.length+' hiệu ứng · '+Object.keys(E.T.tags||{}).length+' trang bị đã gắn hệ.';
 return E.J('database/mecha-studio.json').then(function(d){EQ=((d&&d.equips)||[]).map(function(x){return{id:x.id,name:x.name,slot:x.slot,set:x.set||'',dmgType:x.dmgType||'',rarity:x.rarity}})}).catch(function(){EQ=[]})})
 .then(render).catch(function(e){$('src').className='card er';$('src').innerHTML='✘ '+esc(e.message)+'. Cần file <code>database/elements.json</code> cùng thư mục (hoặc đã up lên GitHub).'});
})();
