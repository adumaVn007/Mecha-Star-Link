<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mecha Studio – Dữ liệu game</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#efe7d6;--card:#f7f1e3;--tx:#2b2118;--mut:#7a6a58;--bd:#bda985;--red:#8b1e1e;--ok:#4b7a52;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17130f;--card:#211b15;--tx:#eadfcb;--mut:#a2937d;--bd:#4a3e30;--red:#d9605a;--ok:#7fbf86;color-scheme:dark}}
*{box-sizing:border-box}html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.35 Georgia,"Noto Serif","Times New Roman",serif}
#app{max-width:760px;margin:0 auto;padding:8px;display:flex;flex-direction:column;gap:8px}
header{display:flex;gap:6px;align-items:center;flex-wrap:wrap}header h1{font-size:18px;margin:0;flex:1}
button,.btn{font:inherit;color:var(--tx);background:var(--card);border:1px solid var(--bd);border-radius:6px;padding:8px 10px;cursor:pointer;display:inline-block}
.pri{background:var(--red);color:#fff;border-color:var(--red)}
#tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}#tabs button{white-space:nowrap}#tabs .on{border-color:var(--red);color:var(--red);font-weight:700}
.mut{color:var(--mut);font-size:12px}#msg{color:var(--red);font-size:12px}#gst{font-weight:700}#gbn{cursor:pointer;font-weight:700}#gbn[hidden]{display:none}#gbn.ok{border-color:var(--ok);color:var(--ok)}#gbn.er{border-color:var(--red);color:var(--red)}.dt td,.dt th{padding:4px 6px;border-bottom:1px solid var(--bd);text-align:left}.dt .df{color:var(--red);font-weight:700}pre.js{max-height:300px;overflow:auto;font-size:11px;background:var(--bg);padding:6px;border-radius:5px;white-space:pre-wrap;word-break:break-all}details{margin-top:6px}#ov{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;padding:16px;z-index:99}#ov[hidden]{display:none}#ov .bx{background:var(--card);border:2px solid var(--bd);border-radius:10px;max-width:420px;width:100%;padding:16px;text-align:center}#ov .bx.ok{border-color:var(--ok)}#ov .bx.er{border-color:var(--red)}#ov h3{margin:0 0 8px;font-size:18px}#ov .bx.ok h3{color:var(--ok)}#ov .bx.er h3{color:var(--red)}#ov p{margin:0 0 12px;white-space:pre-line}#gst.ok{color:var(--ok)}#gst.er{color:var(--red)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:6px;padding:8px;margin-top:8px}
.row{display:flex;gap:10px}.fl{flex:1;display:grid;grid-template-columns:1fr 1fr;gap:6px;min-width:0}
@media(max-width:480px){.row{flex-direction:column}}
.fl>div{min-width:0}.fl>div:first-child,.fl>div.w{grid-column:1/-1}
.im{width:110px;height:110px;flex:none;border:1px dashed var(--bd);border-radius:6px;display:flex;align-items:center;justify-content:center;text-align:center;color:var(--mut);font-size:12px;cursor:pointer;overflow:hidden}
.im img{width:100%;height:100%;object-fit:contain}
input:not([type=checkbox]),select{width:100%;font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--bd);border-radius:5px;padding:6px}
.ck{display:inline-flex;gap:4px;align-items:center;margin:2px 8px 2px 0}
#mp{position:relative;margin-top:8px}#mp img{width:100%;display:block;border:1px solid var(--bd)}
.pn{position:absolute;transform:translate(-50%,-50%);font-size:11px;font-style:normal;background:var(--card);border:1px solid var(--red);border-radius:10px;padding:0 6px;white-space:nowrap;pointer-events:none}
.pn.realm{border-color:#8a56b0}
.sg{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}.sg .card{margin:0}
.sp{aspect-ratio:1;background-repeat:no-repeat;background-size:400% 400%;border:1px dashed var(--bd);border-radius:6px;margin-bottom:6px}
</style>
</head>
<body>
<div id="ov" hidden><div class="bx" id="ovb"></div></div>
<div id="app">
<header><h1>Mecha Studio</h1><span class="mut" id="sz"></span>
<label class="btn">Nhập dữ liệu<input type="file" accept=".json" hidden onchange="imp(this.files[0])"></label>
<button onclick="ghToggle()">Đồng bộ GitHub</button>
<button class="pri" onclick="exp()">Xuất dữ liệu</button></header>
<div id="ghp" class="card" hidden></div><div id="gst" class="mut"></div><div id="gbn" class="card" hidden onclick="go('db')"></div>
<nav id="tabs"></nav><div id="msg"></div>
<section id="main"></section>
</div>
<script>
const $=s=>document.querySelector(s);
const T={
humans:{l:"Nhân vật (human)",f:[["name","Tên","t"],["rank","Cảnh giới","g",12],["soul","Hồn lực tối đa","n",100],["bio","Mô tả","t"],["str","Sức mạnh (Strength)","n",10],["agi","Nhanh nhẹn (Agility)","n",10],["int","Trí tuệ (Int)","n",10]]},
mechas:{l:"Mecha",f:[["name","Tên","t"],["pilot","Phi công","r:humans"],["hp","HP","n",400],["atk","Tấn công","n",40],["en","Năng lượng","n",100],["reg","Hồi NL mỗi lượt","n",8],["spd","Tốc độ","n",600],["head","Giáp đầu","e:head"],["body","Giáp bụng","e:body"],["shoulder","Giáp vai","e:shoulder"],["arm","Giáp tay","e:arm"],["glove","Găng tay","e:glove"],["leg","Giáp chân","e:leg"],["boot","Giày","e:boot"],["weapon","Vũ khí","e:weapon"],["backpack","Backpack","e:backpack"],["wing","Cánh (cần Backpack)","e:wing"],["drone","Drone (cần Backpack)","e:drone"],["pet","Pet (cần Backpack)","e:pet"]]},
equips:{l:"Trang bị",f:[["name","Tên","t"],["slot","Vị trí","s:Giáp đầu=head|Giáp bụng=body|Giáp vai=shoulder|Giáp tay=arm|Găng tay=glove|Giáp chân=leg|Giày=boot|Backpack=backpack|Cánh=wing|Drone=drone|Pet=pet|Vũ khí=weapon"],["shield","+ Lá chắn","n",0],["hp","+ HP","n",0],["atk","+ Tấn công","n",0],["spd","+ Tốc độ","n",0],["wtype","Loại vũ khí (vũ khí/găng)","s:Không=|Súng=gun|Kiếm=blade|Lõi=core|Tên lửa=missile|Pháo=cannon"],["mastery","Thuần thục vũ khí % (găng)","n",0],["move","Di chuyển địa hình (giày)","n",0],["dtype","Loại drone/pet","s:Sentry=sentry|Repair=repair|Shield=shield"],["mpAtk","MP mỗi đòn","n",0],["dmg","Sát thương (Dmg)","n",0],["dmgType","Hệ sát thương (tạm: Non type)","s:Non type=nontype"],["dmgShape","Dạng sát thương","s:Đơn mục tiêu (Single)=single|Diện rộng (AoE)=aoe"],["acc","Chính xác (Accuracy)","n",0],["skill","Skill (lấy từ tab Nguyên liệu › Skill)","k"],["dur","Độ bền ẩn: số lần hư hỏng tối đa trước khi bị phá hủy hoàn toàn","n",3],["recipe","Nguyên liệu chế tạo (ảnh hưởng chỉ số)","q"],["wcat","Danh mục vũ khí","w"]]},
items:{l:"Vật phẩm",f:[["name","Tên","t"],["type","Hiệu ứng","s:Năng lượng=cell|Hồn lực=tonic|HP (theo %)=nano|Lá chắn=shcell"],["val","Giá trị","n",50],["qty","Số lượng","n",1],["desc","Mô tả","t"]]},
monsters:{l:"Quái vật",f:[["name","Tên","t"],["lv","Cảnh giới","g",12],["hp","HP","n",300],["atk","Tấn công","n",30],["spd","Tốc độ","n",450],["sh","Lá chắn","n",0]]},
places:{l:"Thành phố / Bí cảnh",f:[["name","Tên","t"],["kind","Loại","s:Thành phố=city|Bí cảnh=realm"],["lvl","Cảnh giới quái","g",12],["desc","Mô tả","t"]]}};
const TABS=["humans","mechas","equips","materials","items","monsters","places","map","samples","db"];
T.materials={l:"Nguyên liệu",f:[["name","Tên","t"],["branch","Nhánh","s:Tài liệu từ quái vật=monster|Linh dược / quả kì bí=herb|Đan dược=pill|Công pháp=method|Skill=skill"],["rank","Cảnh giới (Công pháp, Skill)","g"],["desc","Mô tả","t"],["fxHp","Ảnh hưởng HP (Pet/Drone)","n",0],["fxMp","Ảnh hưởng MP mỗi đòn","n",0],["fxDmg","Ảnh hưởng Dmg","n",0],["fxAcc","Ảnh hưởng Accuracy","n",0],["fxDur","Ảnh hưởng độ bền ẩn","n",0]]};
const NM={humans:"Nhân vật",mechas:"Mecha",equips:"Trang bị",materials:"Nguyên liệu",items:"Vật phẩm",monsters:"Quái",places:"Thành/Bí cảnh",map:"Bản đồ",samples:"Ảnh mẫu",db:"Database"};
const WC=()=>["Kiếm","Cung","Nỏ","Búa","Chùy","Khiên","Chùy (biến thể)","Thương (Spear)","Dao","Gậy"].map((n,i)=>({id:"wc"+(i+1),name:n}));
const blank=()=>({v:1,humans:[],mechas:[],equips:[],materials:[],items:[],monsters:[],places:[],map:"",wcats:WC()});
let D=blank(),tab="humans",armed=-1,selP="";
try{const s=localStorage.getItem("mstudio");if(s)D=Object.assign(blank(),JSON.parse(s))}catch(e){}
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const uid=()=>Math.random().toString(36).slice(2,9);
const opt=x=>{const p=x.split("=");return[p[0],p[p.length-1]]};
function notify(ok,msg){const b=$("#ovb");b.className="bx "+(ok?"ok":"er");b.innerHTML=`<h3>${ok?"✔ Thành công":"✖ Thất bại"}</h3><p>${esc(msg)}</p><button class="pri" onclick="$('#ov').hidden=true">Đóng</button>`;$("#ov").hidden=false}
function ask(title,msg,yes,lab){const b=$("#ovb");b.className="bx";b.innerHTML=`<h3>${esc(title)}</h3><p>${esc(msg)}</p><div style="display:flex;gap:8px;justify-content:center"><button class="pri" id="ovy">${esc(lab||"Xác nhận")}</button><button onclick="$('#ov').hidden=true">Hủy</button></div>`;$("#ov").hidden=false;$("#ovy").onclick=()=>{$("#ov").hidden=true;yes()}}
function doAdd(title,msg,fn){ask(title,msg,()=>{Promise.resolve().then(fn).then(r=>notify(r.ok,r.msg)).catch(e=>notify(false,"Thêm thất bại: "+((e&&e.message)||e)))},"Xác nhận thêm")}
function saveLocal(){const j=JSON.stringify(D);$("#sz").textContent=Math.round(j.length/1024)+" KB";
 try{localStorage.setItem("mstudio",j);$("#msg").textContent="";return true}catch(e){$("#msg").textContent="Bộ nhớ trình duyệt đầy hoặc bị chặn: hãy bấm Xuất dữ liệu để giữ bản dự phòng.";return false}}
function save(){const ok=saveLocal();ver++;sD(true);if(ok)ghSchedule();return ok}
function go(t){tab=t;armed=-1;render()}
function render(){
 $("#tabs").innerHTML=TABS.map(t=>`<button class="${t===tab?"on":""}" onclick="go('${t}')">${NM[t]}${Array.isArray(D[t])?" ("+D[t].length+")":""}</button>`).join("");
 if(tab==="map")return mapView();if(tab==="samples")return samples();if(tab==="db")return dbView();
 if(tab==="mechas")return mechaView();if(tab==="equips")return equipView();if(tab==="materials")return materialView();
 $("#main").innerHTML=`<button class="pri" onclick="add()">+ Thêm ${T[tab].l.toLowerCase()}</button>`+D[tab].map((o,i)=>card(o,i)).join("");}
function card(o,i){return `<div class="card"><div class="row"><label class="im">${o.img?`<img src="${o.img}">`:"Chạm để chọn ảnh"}<input type="file" accept="image/*" hidden onchange="pic(${i},this.files[0])"></label><div class="fl">${visFields(o).map(f=>fld(o,i,f)).join("")}</div></div>
<div style="margin-top:6px"><button onclick="del(${i})">${armed===i?"Bấm lần nữa để xóa":"Xóa"}</button></div></div>`}
function fld(o,i,[k,l,ty]){const v=o[k]??"";let c;
 if(ty==="t")c=`<input value="${esc(v)}" oninput="ed(${i},'${k}',this.value)">`;
 else if(ty==="n")c=`<input type="number" value="${v}" oninput="ed(${i},'${k}',+this.value)">`;
 else if(ty[0]==="s")c=`<select onchange="ed(${i},'${k}',this.value)">${ty.slice(2).split("|").map(x=>{const[a,b]=opt(x);return `<option value="${b}" ${v==b?"selected":""}>${a}</option>`}).join("")}</select>`;
 else if(ty[0]==="e")c=`<select ${["wing","drone","pet"].includes(k)&&!o.backpack?"disabled":""} onchange="ed(${i},'${k}',this.value)"><option value="">Chưa gắn</option>${D.equips.filter(x=>x.slot===ty.slice(2)).map(x=>`<option value="${x.id}" ${v===x.id?"selected":""}>${esc(x.name)}</option>`).join("")}</select>`;
 else if(ty[0]==="r")c=`<select onchange="ed(${i},'${k}',this.value)"><option value="">Chưa chọn</option>${D[ty.slice(2)].map(x=>`<option value="${x.id}" ${v===x.id?"selected":""}>${esc(x.name)}</option>`).join("")}</select>`;
 else if(ty[0]==="w")c=`<select onchange="ed(${i},'${k}',this.value)">${D.wcats.map(x=>`<option value="${x.id}" ${v===x.id?"selected":""}>${esc(x.name)}</option>`).join("")}</select>`;
 else if(ty[0]==="g")c=`<select onchange="ed(${i},'${k}',this.value===''?'':+this.value)"><option value="">Chưa đặt</option>${RK.map((r,j)=>`<option value="${j}" ${v!==""&&+v===j?"selected":""}>${r}</option>`).join("")}</select>`;
 else if(ty[0]==="k")c=`<select onchange="ed(${i},'${k}',this.value)"><option value="">Chưa chọn</option>${D.materials.filter(m=>m.branch==="skill").map(m=>`<option value="${m.id}" ${v===m.id?"selected":""}>${esc(m.name)}${m.rank!==undefined&&m.rank!==""?" · "+RK[m.rank]:""}</option>`).join("")}</select>`;
 else if(ty[0]==="q")c=(Array.isArray(v)?v:[]).map((x,j)=>`<div style="display:flex;gap:6px;margin-top:4px"><select onchange="rcSet(${i},${j},'m',this.value)"><option value="">Chọn nguyên liệu</option>${D.materials.filter(m=>m.branch!=="skill").map(m=>`<option value="${m.id}" ${x.m===m.id?"selected":""}>${esc(m.name)}</option>`).join("")}</select><input type="number" min="1" style="width:70px" value="${x.q||1}" onchange="rcSet(${i},${j},'q',+this.value)"><button onclick="rcDel(${i},${j})">✕</button></div>`).join("")+`<button style="margin-top:6px" onclick="rcAdd(${i})">+ Thêm nguyên liệu</button>`;
 else c=D[ty.slice(2)].map(x=>`<label class="ck"><input type="checkbox" ${(o[k]||[]).includes(x.id)?"checked":""} onchange="tg(${i},'${k}','${x.id}',this.checked)">${esc(x.name)}</label>`).join("")||'<span class="mut">Chưa có trang bị nào</span>';
 return `<div class="${ty[0]==="m"||ty[0]==="q"?"w":""}"><span class="mut">${l}</span>${c}</div>`}
function newObj(t,extra){const o={id:uid()};
 T[t].f.forEach(([k,,ty,d])=>{o[k]=d!==undefined?d:ty==="t"?"":ty==="n"?0:ty[0]==="s"?opt(ty.slice(2).split("|")[0])[1]:ty[0]==="m"||ty[0]==="q"?[]:""});
 o.name="Mới";return Object.assign(o,extra||{})}
function pushNew(t,o,label){D[t].push(o);const ok=save();render();return{ok,msg:ok?`Đã thêm "${o.name}" vào ${label}. Hãy sửa tên và thông số bên dưới.`:`Không lưu được "${o.name}" vào ${label}: bộ nhớ trình duyệt đầy hoặc bị chặn. Hãy bấm Xuất dữ liệu để giữ bản dự phòng.`}}
function add(){const t=tab;doAdd("Thêm "+T[t].l.toLowerCase(),`Thêm một mục mới vào "${NM[t]}"?`,()=>pushNew(t,newObj(t),NM[t]))}
let esub="armor",wsel="",showWC=false;
const EG={armor:s=>!["weapon","drone","pet"].includes(s.slot),weapon:s=>s.slot==="weapon",drone:s=>s.slot==="drone",pet:s=>s.slot==="pet"};
const EL={armor:"Giáp & phụ kiện",weapon:"Vũ khí",drone:"Drone",pet:"Pet"};
function wInCat(o){const known=D.wcats.some(c=>c.id===o.wcat);return o.wcat===wsel||(!known&&D.wcats[0]&&wsel===D.wcats[0].id)}
function equipView(){
 if(!Array.isArray(D.wcats))D.wcats=WC();
 if(!D.wcats.some(c=>c.id===wsel))wsel=D.wcats[0]?D.wcats[0].id:"";
 const all=D.equips.map((o,i)=>[o,i]);
 let h=`<div style="display:flex;gap:6px;flex-wrap:wrap;margin:8px 0">${Object.keys(EL).map(k=>`<button class="${esub===k?"pri":""}" onclick="esub='${k}';showWC=false;armed=-1;render()">${EL[k]} (${D.equips.filter(EG[k]).length})</button>`).join("")}</div>`;
 let list=all.filter(([o])=>EG[esub](o));
 if(esub==="weapon"){
  h+=`<div style="display:flex;gap:6px;flex-wrap:wrap;margin:8px 0">${D.wcats.map(c=>`<button class="${c.id===wsel?"pri":""}" onclick="wsel='${c.id}';armed=-1;render()">${esc(c.name)}</button>`).join("")}</div>
  <div style="display:flex;gap:6px;flex-wrap:wrap"><button class="pri" onclick="addEq('weapon')">+ Thêm vũ khí</button><button onclick="showWC=!showWC;render()">+ Thêm danh mục vũ khí</button></div>`;
  if(showWC)h+=`<div class="card"><b>Thêm danh mục vũ khí mới</b><p class="mut">Danh mục là nhóm (ví dụ Kiếm, Cung). Khác với thêm vũ khí: ở đây chỉ tạo nhóm mới, chưa có vũ khí nào bên trong.</p><input id="wcName" placeholder="Tên danh mục, ví dụ: Rìu"><div style="margin-top:6px"><button class="pri" onclick="addWCat()">Thêm danh mục</button></div></div>`;
  list=list.filter(([o])=>wInCat(o));
  const cur=D.wcats.find(c=>c.id===wsel);
  if(cur&&!list.length)h+=`<div style="margin-top:6px"><button onclick="delWCat()">Xóa danh mục "${esc(cur.name)}" (đang trống)</button></div>`;
 }else h+=`<button class="pri" onclick="addEq('${esub}')">+ Thêm ${EL[esub].toLowerCase()}</button>`;
 h+=list.length?list.map(([o,i])=>card(o,i)).join(""):'<p class="mut">Chưa có mục nào trong nhánh này.</p>';
 $("#main").innerHTML=h}
function addEq(kind){
 const cat=D.wcats.find(c=>c.id===wsel),lab=EL[kind].toLowerCase();
 doAdd("Thêm "+lab,kind==="weapon"?`Thêm vũ khí mới vào danh mục "${cat?cat.name:"?"}"?`:`Thêm một mục mới vào "${EL[kind]}"?`,()=>{
  if(kind==="weapon"&&!cat)return{ok:false,msg:"Thêm vũ khí thất bại: chưa có danh mục vũ khí nào. Hãy thêm danh mục trước."};
  const o=newObj("equips",kind==="weapon"?{slot:"weapon",wcat:cat.id}:kind==="drone"?{slot:"drone"}:kind==="pet"?{slot:"pet"}:{});
  return pushNew("equips",o,kind==="weapon"?`danh mục ${cat.name}`:EL[kind])})}
function addWCat(){const name=$("#wcName").value.trim();
 doAdd("Thêm danh mục vũ khí",`Thêm danh mục "${name||"(chưa đặt tên)"}"?`,()=>{
  if(!name)return{ok:false,msg:"Thêm danh mục thất bại: chưa nhập tên danh mục."};
  if(D.wcats.some(c=>c.name.toLowerCase()===name.toLowerCase()))return{ok:false,msg:`Thêm danh mục thất bại: danh mục "${name}" đã tồn tại.`};
  const c={id:"wc"+uid(),name};D.wcats.push(c);wsel=c.id;showWC=false;const ok=save();render();
  return{ok,msg:ok?`Đã thêm danh mục vũ khí "${name}".`:`Không lưu được danh mục "${name}": bộ nhớ trình duyệt đầy hoặc bị chặn.`}})}
function delWCat(){const c=D.wcats.find(x=>x.id===wsel);if(!c)return;
 ask("Xóa danh mục",`Xóa danh mục "${c.name}"?`,()=>{D.wcats=D.wcats.filter(x=>x.id!==c.id);const ok=save();render();notify(ok,ok?`Đã xóa danh mục "${c.name}".`:"Xóa không lưu được vào bộ nhớ trình duyệt.")},"Xác nhận xóa")}
function ed(i,k,v){const o=D[tab][i];o[k]=v;if(tab==="mechas"&&k==="backpack"){if(!v)o.wing=o.drone=o.pet="";save();return render()}save()}
function tg(i,k,id,on){const a=D[tab][i][k]=D[tab][i][k]||[];const p=a.indexOf(id);if(on&&p<0)a.push(id);if(!on&&p>=0)a.splice(p,1);save()}
function del(i){if(armed!==i){armed=i;return render()}const id=D[tab][i].id;D[tab].splice(i,1);armed=-1;

 $("#ghp").innerHTML=`<b>Đồng bộ GitHub</b><p class="mut">Token chỉ lưu trong trình duyệt của máy này, không nằm trong file. Dùng fine-grained token, chỉ cấp quyền Contents: Read and write cho đúng repo này.</p>
 <div class="fl">${f("g_owner","Chủ repo (username GitHub)","text",GC.owner)}${f("g_repo","Tên repo","text",GC.repo)}${f("g_branch","Nhánh","text",GC.branch)}${f("g_path","Đường dẫn file dữ liệu","text",GC.path)}${f("g_token","Token","password",GC.token)}</div>
 <label class="ck"><input type="checkbox" id="g_auto" ${GC.auto?"checked":""}>Tự động tải dữ liệu LÊN GitHub sau mỗi thay đổi</label><br><label class="ck"><input type="checkbox" id="g_poll" ${GC.poll?"checked":""}>Tự kiểm tra dữ liệu mới TỪ GitHub (30 giây/lần)</label>
 <div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:6px"><button onclick="ghSave()">Lưu cấu hình</button><button class="pri" onclick="ghPush(true)">⬆ Tải dữ liệu LÊN GitHub</button><button onclick="ghPull(true)">⬇ Lấy dữ liệu TỪ GitHub về máy</button><button onclick="ghForget()">Xóa token</button></div>`}
function ghSave(){GC={owner:$("#g_owner").value.trim(),repo:$("#g_repo").value.trim(),branch:$("#g_branch").value.trim()||"main",path:$("#g_path").value.trim().replace(/^\/+/,""),token:$("#g_token").value.trim(),auto:$("#g_auto").checked,poll:$("#g_poll").checked};
 try{localStorage.setItem(GK,JSON.stringify(GC))}catch(e){}gSt("✔ Đã lưu cấu hình GitHub.","ok");gPoll(true)}
function ghForget(){GC.token="";try{localStorage.setItem(GK,JSON.stringify(GC))}catch(e){}ghPanel();gSt("Đã xóa token khỏi máy này.")}
const gUrl=()=>`https://api.github.com/repos/${GC.owner}/${GC.repo}/contents/${GC.path.split("/").map(encodeURIComponent).join("/")}`;
const gH=a=>({Authorization:"Bearer "+GC.token,Accept:a||"application/vnd.github+json","X-GitHub-Api-Version":"2022-11-28"});
function b64(s){const b=new TextEncoder().encode(s);let r="";for(let i=0;i<b.length;i+=32768)r+=String.fromCharCode.apply(null,b.subarray(i,i+32768));return btoa(r)}
async function gSha(){const r=await fetch(gUrl()+"?ref="+encodeURIComponent(GC.branch),{headers:gH(),cache:"no-store"});
 if(r.status===404)return null;if(!r.ok)throw new Error(await gErr(r));return (await r.json()).sha}
async function gErr(r){let m="";try{m=(await r.json()).message}catch(e){}return "GitHub "+r.status+(m?": "+m:"")}
function ghSchedule(){if(!gOk()||!GC.auto)return;gSt("Có thay đổi — sắp tự động tải dữ liệu LÊN GitHub…");clearTimeout(gTimer);gTimer=setTimeout(ghPush,3000)}
async function ghPush(manual){
 if(!gOk()){gSt("Chưa cấu hình GitHub.","er");if(manual)notify(false,"Tải lên GitHub thất bại: chưa nhập đủ username, tên repo và token.");return}
 if(gBusy){gAgain=true;return}gBusy=true;gSt("Đang tải dữ liệu LÊN GitHub…");
 try{
  const body=b64(JSON.stringify(D,null,1)),v0=ver;let allow=false;
  for(let t=0;t<2;t++){
   const sha=await gSha();
   if(!allow&&sha&&sha!==lastSha){if(manual&&confirm("Dữ liệu trên GitHub đã thay đổi so với lần đồng bộ trước.\nGhi đè bằng dữ liệu trên máy?"))allow=true;else throw new Error("GitHub có dữ liệu mới hơn bản trên máy. Vào tab Database để xem rồi bấm Lấy dữ liệu TỪ GitHub về máy")}
   allow=true;
   const r=await fetch(gUrl(),{method:"PUT",headers:Object.assign(gH(),{"Content-Type":"application/json"}),body:JSON.stringify({message:"Mecha Studio: cập nhật dữ liệu "+new Date().toISOString().slice(0,16).replace("T"," "),content:body,branch:GC.branch,...(sha?{sha}:{})})});
   if(r.ok){try{lastSha=(await r.json()).content.sha;sLS();rSha=lastSha}catch(e){}R=JSON.parse(JSON.stringify(D));rTime=new Date();if(ver===v0)sD(false);banner("");if(tab==="db")render();const m=`Đã tải dữ liệu LÊN GitHub thành công (${GC.owner}/${GC.repo} › ${GC.path}) lúc ${new Date().toLocaleTimeString()}.`;gSt("✔ "+m,"ok");if(manual)notify(true,m);break}
   if((r.status===409||r.status===422)&&t===0)continue;
   throw new Error(await gErr(r))}
 }catch(e){const m="Tải dữ liệu LÊN GitHub thất bại: "+e.message+". Dữ liệu vẫn còn trên máy; bấm Xuất dữ liệu để giữ bản dự phòng.";gSt("✖ "+m,"er");notify(false,m)}
 gBusy=false;if(gAgain){gAgain=false;ghPush(manual)}}
async function gMeta(){const r=await fetch(gUrl()+"?ref="+encodeURIComponent(GC.branch),{headers:gH(),cache:"no-store"});if(r.status===404)return null;if(!r.ok)throw new Error(await gErr(r));return r.json()}
async function gRaw(){const r=await fetch(gUrl()+"?ref="+encodeURIComponent(GC.branch),{headers:gH("application/vnd.github.raw+json"),cache:"no-store"});if(!r.ok)throw new Error(await gErr(r));return JSON.parse(await r.text())}
const cnt=o=>CATS.map(k=>NM[k]+" "+((o[k]||[]).length)).join(", ");
async function ghPull(manual){
 if(!gOk()){if(manual){gSt("Chưa cấu hình GitHub.","er");notify(false,"Lấy dữ liệu từ GitHub thất bại: chưa nhập đủ username, tên repo và token.")}return}
 if(manual&&!confirm("Dữ liệu trên máy sẽ bị thay bằng bản trên GitHub. Tiếp tục?"))return;
 gSt("Đang lấy dữ liệu TỪ GitHub về máy…");
 try{const m=await gMeta();
  if(!m){gSt("GitHub chưa có file dữ liệu; sẽ được tạo ở lần tải lên đầu tiên.");if(manual)notify(false,"Lấy dữ liệu thất bại: trên GitHub chưa có file "+GC.path+".");return}
  R=await gRaw();rSha=m.sha;rTime=new Date();
  D=Object.assign(blank(),R);saveLocal();lastSha=m.sha;sLS();sD(false);banner("");render();
  gSt("✔ Đã lấy dữ liệu TỪ GitHub về máy.","ok");if(manual)notify(true,"Đã lấy dữ liệu từ GitHub về máy thành công.")}
 catch(e){gSt("✖ Lấy dữ liệu từ GitHub thất bại: "+e.message,"er");if(manual)notify(false,"Lấy dữ liệu từ GitHub thất bại: "+e.message)}}
async function gPoll(manual){
 if(!gOk()){if(manual)gSt("Chưa cấu hình GitHub.","er");return}
 if(gBusy||pBusy)return;pBusy=true;
 try{const m=await gMeta();rTime=new Date();
  if(!m){R=null;rSha="";banner("");gSt("GitHub chưa có file "+GC.path+". File sẽ được tạo khi bạn tải dữ liệu lên.")}
  else{
   if(!R||m.sha!==rSha){R=await gRaw();rSha=m.sha}
   const empty=!CATS.some(k=>(D[k]||[]).length);
   if(m.sha===lastSha){banner("");gSt(dirty?"Máy có thay đổi chưa tải lên GitHub.":"✔ Dữ liệu trên máy đã khớp GitHub (kiểm tra lúc "+rTime.toLocaleTimeString()+").",dirty?"":"ok")}
   else if(!dirty&&(lastSha||empty)){D=Object.assign(blank(),R);saveLocal();lastSha=m.sha;sLS();render();
    banner("✔ Có dữ liệu mới trên GitHub ("+cnt(R)+") — đã cập nhật vào ứng dụng. Bấm để xem tab Database.","ok");gSt("✔ Đã nhận dữ liệu mới từ GitHub lúc "+rTime.toLocaleTimeString()+".","ok")}
   else{banner("⚠ GitHub có dữ liệu khác với máy bạn. Bấm để xem tab Database rồi chọn Lấy về hoặc Tải lên.","er");gSt("⚠ Dữ liệu GitHub và dữ liệu trên máy khác nhau.","er")}}
  if(tab==="db")render();
 }catch(e){gSt("✖ Không kiểm tra được GitHub: "+e.message,"er")}
 pBusy=false}
function dbView(){
 const url=gOk()?`https://github.com/${GC.owner}/${GC.repo}/blob/${GC.branch}/${GC.path}`:"";
 const st=!gOk()?"chưa cấu hình":!R?"chưa có dữ liệu trên GitHub":rSha!==lastSha?"GitHub khác máy":dirty?"máy có thay đổi chưa tải lên":"đã khớp";
 const strip=JSON.stringify(R,(k,v)=>(k==="img"||k==="map")&&typeof v==="string"&&v.length>200?"[ảnh "+Math.round(v.length/1024)+" KB]":v,1)||"";
 $("#main").innerHTML=`<div class="card"><b>Database trên GitHub</b>
 <div class="mut">${gOk()?esc(GC.owner+"/"+GC.repo+" › "+GC.branch+" › "+GC.path):"Chưa cấu hình: bấm Đồng bộ GitHub ở đầu trang."}</div>
 <div class="mut">Phiên bản GitHub: ${rSha?rSha.slice(0,7):"—"} · Kiểm tra lần cuối: ${rTime?rTime.toLocaleTimeString():"—"}</div>
 <div><b>Trạng thái: ${esc(st)}</b></div>
 <div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:6px"><button onclick="gPoll(true)">Kiểm tra ngay</button><button onclick="ghPull(true)">⬇ Lấy dữ liệu TỪ GitHub về máy</button><button class="pri" onclick="ghPush(true)">⬆ Tải dữ liệu LÊN GitHub</button>${url?`<a class="btn" href="${esc(url)}" target="_blank" rel="noopener">Mở file trên GitHub</a>`:""}</div></div>
 ${R?`<div class="card"><table class="dt" style="width:100%;border-collapse:collapse"><tr><th>Mục</th><th>GitHub</th><th>Trên máy</th></tr>${CATS.map(k=>{const a=(R[k]||[]).length,b=(D[k]||[]).length;return `<tr><td>${NM[k]}</td><td>${a}</td><td class="${a!==b?"df":""}">${b}</td></tr>`}).join("")}</table>
 ${CATS.map(k=>`<details><summary>${NM[k]} trên GitHub (${(R[k]||[]).length})</summary>${(R[k]||[]).map(x=>`<div class="mut">• ${esc(x.name||x.id||"?")}</div>`).join("")||'<div class="mut">Trống</div>'}</details>`).join("")}
 <details><summary>Xem nội dung JSON (đã ẩn dữ liệu ảnh)</summary><pre class="js">${esc(strip.slice(0,30000))}${strip.length>30000?"\n… (đã cắt bớt)":""}</pre></details></div>`:'<p class="mut">Chưa có dữ liệu để hiển thị.</p>'}`}
function ghInit(){
 if(gOk())gPoll(true);
 setInterval(()=>{if(GC.poll&&!document.hidden)gPoll()},30000);
 document.addEventListener("visibilitychange",()=>{if(!document.hidden&&GC.poll)gPoll()})}

saveLocal();render();ghInit();
</script>
</body>
</html>
