<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Vân Giáp – Chiến đấu</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#efe7d6;--card:#f7f1e3;--tx:#2b2118;--mut:#7a6a58;--bd:#bda985;--red:#8b1e1e;--hp:#4b7a52;--en:#3f5fa8;--sh:#2c8fa5;--so:#8a56b0;--atb:#c58a2b;--bad:#b3261e;
--sky1:#eef0e4;--sky2:#cdd9d0;--mt1:#a9bdb0;--mt2:#86a295;--m1:#3a3f46;--m2:#23272d;--acc:#c0392b;--b1:#4a5a55;--b2:#2f3b38;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17130f;--card:#211b15;--tx:#eadfcb;--mut:#a2937d;--bd:#4a3e30;--red:#d9605a;--hp:#7fbf86;--en:#7d9be0;--sh:#5cc6dc;--so:#b98ce0;--atb:#e0aa4d;--bad:#f2766d;--sky1:#27323a;--sky2:#1b2429;--mt1:#35504a;--mt2:#27403b;--m1:#c9ced6;--m2:#8c93a0;--acc:#ff7a6b;--b1:#9fb3ab;--b2:#6b7e77;color-scheme:dark}}
*{box-sizing:border-box}html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.35 Georgia,"Noto Serif","Times New Roman",serif}
.wrap{max-width:980px;margin:0 auto;padding:8px;display:grid;gap:8px}
@media(min-width:860px){.wrap{grid-template-columns:1fr 260px}}
main{display:flex;flex-direction:column;gap:8px;min-width:0}
.card{background:var(--card);border:1px solid var(--bd);border-radius:6px;padding:8px}
.order{display:flex;justify-content:center;gap:14px}
.pt{text-align:center;width:64px;font-size:10px;color:var(--mut)}
.pt b{display:block;font-size:22px;line-height:1.2}
.mb{height:4px;background:var(--bd);border-radius:2px;overflow:hidden}.mb i{display:block;height:100%;background:var(--atb);width:0}
#stage{position:relative;border:1px solid var(--bd);border-radius:6px;overflow:hidden}
#stage svg{display:block;width:100%;height:auto}
.tag{position:absolute;left:8px;top:8px;background:var(--card);border:1px solid var(--bd);padding:1px 7px;font-size:12px}
.pop{position:absolute;top:34%;font:700 20px Georgia,serif;color:var(--bad);text-shadow:0 1px 0 var(--card);animation:fl .9s forwards;pointer-events:none}
.pop.g{color:var(--hp)}
@keyframes fl{to{transform:translateY(-34px);opacity:0}}
.hit{animation:bl .25s}@keyframes bl{50%{opacity:.25}}
.panels{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.panel{border-left:3px solid var(--hp);padding:5px 6px;min-width:0}.panel.e{border-left-color:var(--red)}
.hd{color:var(--red);font-weight:700;font-size:10px;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nm{font-size:13px;font-weight:700;margin:0 0 3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nm small{font-weight:400;color:var(--mut);font-size:10px;margin-left:5px}
.sb{position:relative;display:flex;justify-content:space-between;gap:4px;height:15px;margin:2px 0;padding:0 4px;border-radius:3px;background:var(--bd);overflow:hidden;font-size:10px;line-height:15px;white-space:nowrap}
.sb i{position:absolute;left:0;top:0;bottom:0;width:0;opacity:.8;transition:width .25s}
.sb span,.sb b{position:relative;z-index:1;text-shadow:0 0 2px var(--card),0 0 2px var(--card)}.sb b{font-weight:700}
.sb em{font-style:normal;opacity:.8;margin-left:3px}
.flag{font-size:10px;color:var(--bad);line-height:1.2}.bf{font-size:10px;color:var(--red);line-height:1.2}
.comps{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:6px}
#skills{display:flex;flex-direction:column;gap:6px}
.skg{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
#skills button{padding:6px 2px;min-height:78px;min-width:0}
#skills button.sk{border:2px solid var(--rc,var(--bd));background:var(--card);background:linear-gradient(color-mix(in srgb,var(--rc,var(--bd)) 16%,var(--card)),var(--card))}
#ordw{position:relative}.pt[data-p]{cursor:pointer}.pt.on b{outline:2px solid var(--atb);border-radius:8px}
#pasv{display:none;position:absolute;z-index:4;top:100%;left:50%;transform:translateX(-50%);width:min(340px,94vw);max-height:45vh;overflow:auto;padding:8px 10px;font-size:12px;box-shadow:0 6px 18px #0006}
#pasv .ph{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:11px;color:var(--mut);margin-bottom:4px}#pasv .ph button{padding:2px 10px;min-height:30px}
#pasv .it{padding:3px 0;border-bottom:1px dotted var(--bd)}
#stage[data-tone=light]{--m1:#3a3f46;--m2:#23272d;--acc:#c0392b;--b1:#4a5a55;--b2:#2f3b38}
#stage[data-tone=dark]{--m1:#c9ced6;--m2:#8c93a0;--acc:#ff7a6b;--b1:#9fb3ab;--b2:#6b7e77}
button{font:inherit;color:var(--tx);background:var(--card);border:1px solid var(--bd);border-radius:6px;padding:9px 10px;cursor:pointer}
button:disabled{opacity:.4;cursor:default}button.pri{background:var(--red);color:#fff;border-color:var(--red)}
.sk i{display:block;font-style:normal;font-size:9px;color:var(--atb);line-height:1.1}.sk b{display:block;font-size:11.5px;line-height:1.15;margin:1px 0}.sk span{display:block;font-size:10px;color:var(--mut);line-height:1.2}.sk em{font-style:normal;font-size:19px}
#bar{display:flex;flex-wrap:wrap;gap:6px;align-items:center}#bar .gap{flex:1}
#log{font-size:12.5px;max-height:130px;overflow:auto}
@media(min-width:860px){#log{max-height:none;height:100%;min-height:400px}}
#log h4{margin:0 0 4px;font-size:11px;letter-spacing:.08em;color:var(--mut)}#log div{padding:2px 0;border-bottom:1px dotted var(--bd)}#log div:last-child{font-weight:700}
.ov{position:fixed;inset:0;background:#0007;display:flex;align-items:center;justify-content:center;padding:16px;z-index:5}
.box{background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:14px;width:100%;max-width:380px;display:flex;flex-direction:column;gap:8px}
.box h3{margin:0}.box button{text-align:left}.box .mut{color:var(--mut);font-size:12px}
</style>
</head>
<body>
<div class="wrap">
<main>

<div id="stage">
<svg viewBox="0 0 400 210" preserveAspectRatio="xMidYMid slice">

<ellipse cx="46" cy="56" rx="40" ry="22" fill="var(--b1)"/>

<rect x="20" y="70" width="8" height="34" fill="var(--b2)"/><rect x="34" y="72" width="8" height="32" fill="var(--b2)"/><rect x="58" y="72" width="8" height="32" fill="var(--b2)"/><rect x="70" y="70" width="8" height="34" fill="var(--b2)"/>
<polygon points="22,40 32,16 40,38" fill="var(--b2)"/><polygon points="42,36 54,12 60,36" fill="var(--b2)"/></g><g class="sp" data-s="turtle" style="display:none"><ellipse cx="50" cy="62" rx="46" ry="30" fill="var(--b2)"/><path d="M12 62 Q50 8 88 62Z" fill="var(--b1)"/><path d="M30 56 L50 30 L70 56 M50 30 V62" stroke="var(--b2)" stroke-width="3" fill="none"/><ellipse cx="96" cy="64" rx="13" ry="9" fill="var(--b1)"/><circle cx="100" cy="61" r="3" fill="var(--acc)"/><rect x="22" y="80" width="14" height="22" rx="4" fill="var(--b2)"/><rect x="62" y="80" width="14" height="22" rx="4" fill="var(--b2)"/></g><g class="sp" data-s="tiger" style="display:none"><path d="M6 54 Q-18 30 -6 12" stroke="var(--b2)" stroke-width="7" fill="none" stroke-linecap="round"/><ellipse cx="46" cy="54" rx="42" ry="24" fill="var(--b1)"/><path d="M26 34 L30 74 M42 31 L46 78 M58 33 L62 76" stroke="var(--b2)" stroke-width="4" fill="none"/><circle cx="90" cy="46" r="17" fill="var(--b1)"/><polygon points="80,32 84,18 92,30" fill="var(--b2)"/><polygon points="94,30 102,18 106,34" fill="var(--b2)"/><circle cx="96" cy="44" r="3.5" fill="var(--acc)"/><rect x="18" y="70" width="9" height="34" fill="var(--b2)"/><rect x="34" y="72" width="9" height="32" fill="var(--b2)"/><rect x="58" y="72" width="9" height="32" fill="var(--b2)"/><rect x="72" y="70" width="9" height="34" fill="var(--b2)"/></g></g>
</svg>
<span class="tag" id="rd">Hiệp 1</span>
</div>
<div class="panels"><div class="card panel" id="pp"></div><div class="card panel e" id="ep"></div></div>
<div id="dp" class="comps" style="display:none"></div>
<div id="skills"></div>
<div id="bar">
<button id="bBag">Hành trang</button><button id="bSum">Triệu hồi</button><button id="bRun">Chạy</button>
<span class="gap"></span>
<button id="bSpd">x1</button><button id="bAuto">Auto ○</button><button id="bSet">Cài đặt</button>

</div>
</main>

</div>

<script src="vg-combat-scene.js?v=202611271"></script>
<script>
const GM=VG.game;let SV,EV,PRACTICE=false;
const $=s=>document.querySelector(s);
const rnd=a=>a[Math.floor(Math.random()*a.length)],ri=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const BEASTS=["Xích Lang Cơ","Thiết Giáp Quy","Hư Ảnh Hổ","Ma Tượng Cơ","Kim Cương Sư","Sương Phách Lang"];
const DR={pet:{n:"Pet",ic:"🐾",d:"Đồng hành, tự hỗ trợ."},sentry:{n:"Sentry Drone",ic:"🛸",d:"Tự bắn địch mỗi nhịp."},repair:{n:"Repair Pet",ic:"🐕",d:"Tự hồi HP cho mecha."},shield:{n:"Shield Orb",ic:"🔰",d:"Tự nạp lá chắn tạm."}};
let G,SK=[],PAS=[],LIB=null;
/* Nền theo địa hình: khóa từ index.html (ST.pending.ter) hoặc ?scene=... ; cấu hình ghi đè ở database/combat-ui.json (sửa bằng EditPlayoutCombat.html) */
let SC=null,SCENE="grass";
const RC=["","#a89f8d","#4fa86a","#3d7fd6","#8c52d6","#d9a21b"],RN=["Cơ bản","Phổ thông","Tốt","Hiếm","Sử thi","Truyền thuyết"];
const scName=()=>((SC&&SC[SCENE])||{}).name||"";
function applyScene(){const c=SC&&(SC[SCENE]||SC.grass);if(!c)return;$("#bg").innerHTML=VG.combatScene.svg(c,"bt");$("#stage").dataset.tone=c.tone}
function loadScenes(){SC=VG.combatScene.merge(null);return fetch("database/combat-ui.json?t="+Date.now()).then(r=>{if(!r.ok)throw 0;return r.json()}).catch(()=>VG.fetchJSON?VG.fetchJSON("database/combat-ui.json"):null).then(j=>{if(j)SC=VG.combatScene.merge(j)}).catch(()=>{})}
/* Cảnh giới chính thức: G.lv là số thứ tự cảnh giới 0–48 (bậc cũ N = cảnh giới số N, không đổi công thức chiến đấu).
   0–11: Hoàng/Huyền/Địa/Thiên Giai (mỗi giai Sơ/Trung/Hậu kỳ) · 12–47: Thánh Giai 12 tầng × Sơ/Trung/Hậu · 48: Thần Giai (tối cao). */
const GR=["Hoàng Giai","Huyền Giai","Địa Giai","Thiên Giai"],PH=["Sơ kỳ","Trung kỳ","Hậu kỳ"],RK=[],RS=[],MAXR=48;
(()=>{GR.forEach((g,gi)=>PH.forEach((p,pi)=>{RK.push(g+" "+p);RS.push(g.split(" ")[0]+" "+p.split(" ")[0])}));for(let t=1;t<=12;t++)PH.forEach(p=>{RK.push("Thánh Giai Tầng "+t+" "+p);RS.push("Thánh T"+t+" "+p.split(" ")[0])});RK.push("Thần Giai");RS.push("Thần Giai")})();
const rankName=i=>RK[i]||("Cảnh giới "+i),rankShort=i=>RS[i]||("Cảnh giới "+i);
const need=()=>60+(G.lv-12)*30;
function SHP(m){const S=["wolf","turtle","tiger"];if(S.indexOf(m.shape)>=0)return m.shape;let h=0;for(const c of String(m.id||m.name||""))h=(h*31+c.charCodeAt(0))>>>0;return S[h%3]}
function newGame(){
 const p=SV.p,B=SV.eqB||{};
 G={b:{max:+B.max||0,atk:+B.atk||0,spd:+B.spd||0,sh:+B.sh||0},lv0:p.lv,lv:p.lv,xp:p.xp,hp:p.hp,max:p.max+(+B.max||0),atk:p.atk+(+B.atk||0),en:p.en,enMax:p.enMax,reg:p.reg,soul:p.soul,soulMax:p.soulMax,sh:p.gear?p.shMax+(+B.sh||0):0,shMax:p.gear?p.shMax+(+B.sh||0):0,gear:p.gear,spd:p.spd+(+B.spd||0),atb:650,
 items:Object.assign({},SV.items),drone:null,pet:null,buffs:[],passRed:0,spdX:5,auto:SV.autoSet?!!SV.auto:true,turn:false,over:false,lock:false,modal:false,od:false,round:0,log:[]};
 spawn();say(PRACTICE?"Chế độ luyện tập: kết quả không được lưu.":"Chiến đấu bắt đầu. Vân Giáp sẵn sàng.");}
function spawn(){
 const d=EV.def,m=EV.mon,own=m.rank!=null,lv=own?Math.min(MAXR,Math.max(0,m.rank)):Math.min(MAXR,Math.max(0,G.lv+(d.lvDelta||0))),i=own?0:lv-12,f=k=>Math.max(.5,1+k*i),hm=own?1:(d.hpMul||1),am=own?1:(d.atkMul||1);
 const hp=Math.round(m.hp*f(.15)*hm*(.95+Math.random()*.15)),sh=Math.round((m.sh||0)*f(.1));
 G.e={name:m.name,shape:SHP(m),tierName:"Sự kiện "+EV.tier.name,lv,hp,max:hp,sh,shMax:sh,atk:Math.round(m.atk*f(.13)*am),en:40,enMax:60,spd:Math.round(m.spd+ri(-30,30)),atb:0,dead:false};
 G.round=0;say(`${G.e.name} (${rankName(lv)}) xuất hiện.`);}
function say(t){G.log.push(t);if(G.log.length>60)G.log.shift();const l=$("#log");if(l){l.innerHTML="<h4>NHẬT KÝ</h4>"+G.log.map(x=>`<div>${x}</div>`).join("");l.scrollTop=l.scrollHeight}}
function pop(t,side,g){const d=document.createElement("div");d.className="pop"+(g?" g":"");d.textContent=t;d.style[side==="p"?"left":"right"]="18%";$("#stage").appendChild(d);setTimeout(()=>d.remove(),900)}
function flash(id){const g=$("#"+id);g.classList.remove("hit");void g.getBoundingClientRect();g.classList.add("hit")}
const bp=k=>G.buffs.reduce((a,b)=>a+(b.stat===k?b.pct:0),0);
const redc=d=>Math.max(1,Math.round(d*(1-Math.min(60,bp("dmgRed")+G.passRed)/100)));
const dmg=m=>{let d=G.atk*(1+bp("atk")/100)*m*(.9+Math.random()*.2);if(G.soul<G.soulMax*.25)d*=.7;return Math.round(d)};
function heal(p){const h=Math.round(G.max*p);G.hp=Math.min(G.max,G.hp+h);say(`Hồi ${h} HP.`);pop("+"+h,"p",1)}
function hitE(d,n){const e=G.e;if(e.dead)return;const ab=Math.min(e.sh,d);e.sh-=ab;e.hp-=d-ab;say(`${n}: ${d} sát thương.`);pop(d,"e");flash("em");if(e.hp<=0){e.hp=0;e.dead=true;win()}}
function hitP(d){const ab=Math.min(G.sh,d);G.sh-=ab;G.hp-=d-ab;pop(d,"p");flash("pm");return ab}
/* Skill: cơ bản (VG.skill.BASIC, luôn có) + skill của trang bị đang mặc (database equips[].skills). Pet/Drone chạy theo nhịp riêng. */
function buildSkills(){
 const all=VG.skill.collect(SV,LIB),own=all.filter(s=>s.slot!=="pet"&&s.slot!=="drone"),E={};
 ((LIB&&LIB.equips)||[]).forEach(e=>{if(e&&e.id)E[e.id]=e});
 own.forEach(s=>{const r=Math.round(+((E[s.eqid]||{}).rarity));s.r=r>=1?Math.min(5,r):1});
 /* skill trang bị: phẩm cao → thấp (cùng phẩm giữ thứ tự cũ); skill cơ bản luôn ở cuối */
 const act=own.map((s,i)=>[s,i]).filter(x=>VG.skill.act(x[0])).sort((a,b)=>b[0].r-a[0].r||a[1]-b[1]).map(x=>x[0]);
 /* nhóm trên: skill của trang bị (mọi loại, phẩm cao → thấp). Nhóm cuối: danh sách skill cơ bản (VG.skill.BASIC: mặc định hoặc database/skills.json), khung trung tính */
 SK=act.concat(VG.skill.BASIC.map(s=>Object.assign({},s,{r:0})));
 SK.forEach(s=>{s.d=VG.skill.effText(s)});
 PAS=own.filter(s=>!VG.skill.act(s));
 G.passRed=PAS.reduce((a,s)=>a+(s.type===3&&s.stat==="dmgRed"?s.pct:0),0);
 G.drone=comp("drone");G.pet=comp("pet")}
function comp(slot){const id=SV.eq&&SV.eq[slot],q=id&&LIB&&(LIB.equips||[]).find(x=>x.id===id);if(!q)return null;const hp=Math.max(1,+q.hp||60);
 return{t:String(q.dtype||"").toLowerCase()||(slot==="pet"?"pet":"sentry"),slot,eq:q.id,name:q.name,hp,max:hp,atb:300,spd:520,dmg:+q.dmg||0,acc:+q.acc||100,sk:VG.skill.collect(SV,LIB).filter(s=>s.slot===slot)}}
const comps=()=>[G.drone,G.pet].filter(Boolean);
const cName=d=>d.name||(DR[d.t]||DR.sentry).n,cIc=d=>(DR[d.t]||DR.pet).ic;
function addBuff(s){G.buffs=G.buffs.filter(b=>b.id!==s.id);G.buffs.push({id:s.id,name:s.name,stat:s.stat,pct:s.pct,t:s.turns+1});say(`${s.name}: ${VG.skill.effText(s)}.`);pop("↑","p",1)}
function supEff(s,who){const n=who||s.name;
 if(s.eff==="heal")heal(s.pct/100);
 else if(s.eff==="shield"){if(!G.gear)return;G.sh=Math.min(Math.max(250,G.shMax),G.sh+s.val);say(`${n}: +${s.val} lá chắn.`);pop("+"+s.val,"p",1)}
 else if(s.eff==="en"){G.en=Math.min(G.enMax,G.en+s.val);say(`${n}: +${s.val} năng lượng.`)}
 else if(s.eff==="soul"){G.soul=Math.min(G.soulMax,G.soul+s.val);say(`${n}: +${s.val} hồn lực.`)}
 else if(s.eff==="buff")addBuff(s)}
function runSk(s){
 if(s.eff==="dmg"){for(let i=0;i<s.hits;i++)hitE(dmg(s.mul),s.name)}
 else supEff(s,s.name)}
const can=s=>G.turn&&!G.over&&!G.modal&&G.lv>=(s.lv||0)&&G.en>=s.en&&G.soul>=s.so;
function use(i){const s=SK[i];if(!s||!can(s))return;G.en-=s.en;G.soul-=s.so;runSk(s);endAct()}
function endAct(){G.buffs.forEach(b=>b.t--);G.buffs=G.buffs.filter(b=>b.t>0);G.turn=false;G.atb-=1000;renderAll()}
function endTurn(){if(!G.turn||G.modal)return;G.soul=Math.min(G.soulMax,G.soul+12);G.en=Math.min(G.enMax,G.en+10);say("Kết lượt: nghỉ ngơi, hồi 10 năng lượng và 12 hồn lực.");endAct()}
function win(){const e=G.e,d=EV.def,g=EV.mon.xp||d.xp||40;G.xp+=g;say(`${e.name} bị hạ. +${g} kinh nghiệm.`);
 while(G.lv<MAXR&&G.xp>=need()){G.xp-=need();lvUp()}if(G.lv>=MAXR)G.xp=0;
 const st={};["thuong","trung","cao","sieu"].forEach(k=>{const r=d.stone&&d.stone[k];if(r)st[k]=ri(r[0],r[1])});
 finish("win",g,st);G.over=true;G.turn=false;renderAll();
 const nm={thuong:"Thường",trung:"Trung",cao:"Cao",sieu:"Siêu"},ls=Object.keys(st).map(k=>`+${st[k]} Linh Thạch ${nm[k]}`).join(", ");
 box("Chiến thắng",`${e.name} đã bị hạ.<br>+${g} kinh nghiệm${ls?"<br>"+ls:""}${PRACTICE?"<br>(luyện tập: không lưu)":""}`,"Về bản đồ")}
function finish(type,xp,st){
 if(PRACTICE)return;const p=SV.p;
 const n=G.lv-G.lv0,B=G.b;Object.assign(p,{lv:G.lv,xp:G.xp,hp:Math.max(1,Math.round(G.hp)),max:G.max-Math.round(B.max*Math.pow(1.1,n)),atk:G.atk-Math.round(B.atk*Math.pow(1.08,n)),en:Math.round(G.en),enMax:G.enMax,reg:G.reg,soul:Math.round(G.soul),soulMax:G.soulMax,spd:G.spd-B.spd,gear:G.gear});
 if(G.gear)p.shMax=G.shMax-B.sh;SV.items=Object.assign({},G.items);
 if(st)for(const k in st)SV.stones[k]=(SV.stones[k]||0)+st[k];
 if(type==="flee"&&EV.from)SV.pos={x:EV.from.x,y:EV.from.y};
 if(type==="lose"){p.hp=p.max;p.en=p.enMax;p.soul=p.soulMax;SV.pos={x:EV.spawn.x,y:EV.spawn.y}}
 SV.result={type,uid:EV.uid,mon:(EV.mon&&EV.mon.id)||'',name:G.e.name,xp:xp||0,stone:st||{}};SV.pending=null;GM.save(SV)}
function box(t,h,b){$("#modal").innerHTML=`<div class="ov"><div class="box"><h3>${t}</h3><div class="mut">${h}</div><button class="pri" onclick="toMap()">${b}</button></div></div>`}
function toMap(){GM.nav("index.html")}
function lvUp(){G.lv++;G.max=Math.round(G.max*1.1);G.hp=Math.min(G.max,G.hp+Math.round(G.max*.4));G.atk=Math.round(G.atk*1.08);G.enMax+=8;G.reg+=1;G.soulMax+=4;G.spd+=8;
 if(G.gear)G.shMax+=15;say(`ĐỘT PHÁ: ${rankName(G.lv)}!`);SK.filter(s=>s.lv===G.lv).forEach(s=>say(`Mở khóa kỹ năng: ${s.name}.`))}
function lose(){G.over=true;finish("lose");box("Mecha bị hạ gục","Bạn giữ nguyên cấp và kinh nghiệm. Hồi sinh tại điểm xuất phát.","Hồi sinh &amp; về bản đồ")}
function pace(){G.lock=true;setTimeout(()=>{G.lock=false},420/G.spdX)}
function startTurn(){G.turn=true;G.round++;G.en=Math.min(G.enMax,G.en+G.reg);G.soul=Math.min(G.soulMax,G.soul+3);if(G.gear)G.sh=Math.min(G.shMax,G.sh+8);PAS.filter(s=>s.type===6).forEach(s=>supEff(s,s.name));renderAll();if(G.auto)setTimeout(autoAct,600/G.spdX)}
function enemyAct(){const e=G.e;e.atb-=1000;e.en=Math.min(e.enMax,e.en+6);
 const hv=e.en>=30&&Math.random()<.4;if(hv)e.en-=30;
 const d=redc(Math.round(e.atk*(hv?1.9:1)*(.9+Math.random()*.2)));
 if(G.drone&&Math.random()<.25){G.drone.hp-=d;say(`${e.name} bắn trúng drone: ${d}.`);if(G.drone.hp<=0){say("Drone bị phá hủy.");G.drone=null}}
 else{const ab=hitP(d);say(`${e.name} ${hv?"tung đòn nặng":"tấn công"}: ${d} sát thương${ab?` (khiên chặn ${ab})`:""}.`);if(G.hp<=0){G.hp=0;pace();renderAll();return lose()}}
 pace();renderAll()}
function compAct(d){d.atb-=1000;
 const nm=cName(d),shoot=(mul,s)=>{if(Math.random()*100>d.acc){say(`${nm}: bắn trượt.`);return}const x=Math.round((d.dmg+.25*G.atk)*mul*(.9+Math.random()*.2));for(let i=0;i<(s?s.hits:1);i++)hitE(x,nm)};
 if(d.sk&&d.sk.length){d.sk.forEach(s=>{if(G.over)return;if(s.type===2)shoot(s.mul,s);else if(s.type===6)supEff(s,nm)})}
 else if(d.eq&&d.dmg>0)shoot(1);
 else{
  if(d.t==="sentry")hitE(25+3*(G.lv-12),"Sentry Drone");
  if(d.t==="repair"){const h=Math.round(G.max*.07);G.hp=Math.min(G.max,G.hp+h);say(`Repair Pet hồi ${h} HP.`);pop("+"+h,"p",1)}
  if(d.t==="shield"){G.sh=Math.min(G.sh+35,250);say("Shield Orb nạp +35 lá chắn.")}}
 pace();renderAll()}
function tick(){
 if(G.over||G.turn||G.lock||G.modal)return;const k=.04*G.spdX;
 G.atb+=G.spd*(1+bp("spd")/100)*k;G.e.atb+=G.e.spd*k;comps().forEach(c=>{c.atb+=c.spd*k});
 const a=[["p",G.atb],["e",G.e.atb]].concat(comps().map(c=>[c,c.atb])).filter(x=>x[1]>=1000).sort((x,y)=>y[1]-x[1])[0];
 if(a){if(a[0]==="p")startTurn();else if(a[0]==="e")enemyAct();else compAct(a[0])}
 tickUI()}
function autoAct(){
 if(!G.auto||!G.turn||G.modal||G.over||G.lock)return;
 if(!G.drone&&G.en>=45&&G.soul>=15)return summon("sentry");
 const ok=SK.map((s,i)=>[s,i]).filter(([s])=>can(s));
 const h=ok.find(([s])=>s.eff==="heal");if(G.hp<G.max*.4&&h)return use(h[1]);
 const bf=ok.filter(([s])=>s.eff==="buff"&&s.id!=="overdrive"&&!G.buffs.some(b=>b.id===s.id));
 if(bf.length&&Math.random()<.5)return use(bf[0][1]);
 const at=ok.filter(([s])=>s.eff==="dmg").sort((a,b)=>b[0].en-a[0].en);
 if(!at.length)return endTurn();
 use((Math.random()<.7?at[0]:rnd(at))[1])}
const IT={cell:["Pin năng lượng","+60 năng lượng"],tonic:["Tinh dịch hồn lực","+40 hồn lực"],nano:["Gói nano","+30% HP"],shcell:["Pin lá chắn","+80 lá chắn (cần trang bị)"]};
function modal(h){G.modal=true;$("#modal").innerHTML=`<div class="ov" onclick="if(event.target===this)closeM()"><div class="box">${h}<button onclick="closeM()">Đóng</button></div></div>`;renderAll()}
function closeM(){G.modal=false;$("#modal").innerHTML="";renderAll();if(G.turn&&G.auto)setTimeout(autoAct,300)}
function bag(){modal(`<h3>Hành trang</h3>${Object.keys(IT).map(k=>`<button ${G.turn&&G.items[k]>0&&(k!=="shcell"||G.gear)?"":"disabled"} onclick="item('${k}')">${IT[k][0]} ×${G.items[k]}<div class="mut">${IT[k][1]}</div></button>`).join("")}<div class="mut">Dùng vật phẩm tốn một lượt.</div>`)}
function item(k){if(!G.turn||G.items[k]<1)return;G.items[k]--;
 if(k==="cell")G.en=Math.min(G.enMax,G.en+60);if(k==="tonic")G.soul=Math.min(G.soulMax,G.soul+40);if(k==="nano")heal(.3);if(k==="shcell")G.sh=Math.min(G.sh+80,250);
 say(`Dùng ${IT[k][0]}.`);G.modal=false;$("#modal").innerHTML="";endAct()}
function sumM(){modal(`<h3>Triệu hồi</h3><div class="mut">Chi phí: 30 năng lượng, 10 hồn lực. Chỉ một drone cùng lúc, triệu hồi mới sẽ thay thế.</div>${Object.entries(DR).map(([k,v])=>`<button ${G.turn&&G.en>=30&&G.soul>=10?"":"disabled"} onclick="summon('${k}')">${v.ic} <b>${v.n}</b><div class="mut">${v.d}</div></button>`).join("")}`)}
function summon(t){if(!G.turn||G.en<30||G.soul<10)return;G.en-=30;G.soul-=10;G.drone={t,hp:90,max:90,atb:300,spd:520,sk:[]};say(`Triệu hồi ${DR[t].n}.`);G.modal=false;$("#modal").innerHTML="";endAct()}
function run(){if(!G.turn||G.modal)return;const c=Math.max(.2,Math.min(.85,.45+(G.spd-G.e.spd)/1000));
 if(Math.random()<c){say("Thoát khỏi giao tranh thành công.");G.turn=false;G.over=true;finish("flee");renderAll();setTimeout(toMap,700)}
 else{say("Chạy thất bại, mất lượt.");endAct()}}
function setM(){modal(`<h3>Cài đặt</h3><button onclick="G.gear=!G.gear;G.shMax=G.gear?120+15*(G.lv-12)+G.b.sh:0;G.sh=G.shMax;closeM()">Trang bị lá chắn: ${G.gear?"Đang mang":"Không mang"} (bấm để đổi)</button><button onclick="if(confirm('Xóa bản lưu và làm lại từ đầu?')){GM.reset();toMap()}">Làm lại từ đầu</button>`)}
const B=(l,v,m,c,x)=>`<div class="sb"><i style="width:${m>0?Math.min(100,v/m*100):0}%;background:var(${c})"></i><span>${l}${x?`<em>${x}</em>`:""}</span><b>${Math.round(v)}/${Math.round(m)}</b></div>`;
const AT=(id,v,s)=>`<div class="sb"><i id="${id}" style="width:${Math.min(100,v/10)}%;background:var(--atb)"></i><span>ATB</span><b><span id="${id}t">${Math.round(v)}</span>/1000 · Tốc ${s}</b></div>`;
function renderAll(){
 const e=G.e,d=G.drone;
 document.querySelectorAll("#em .sp").forEach(n=>n.style.display=n.dataset.s===e.shape?"":"none");
 $("#rd").textContent="Hiệp "+Math.max(1,G.round)+(scName()?" · "+scName():"");
 $("#dm").style.display=d?"":"none";
 $("#order").innerHTML=`<div class="pt${G.pv?" on":""}" data-p="1" title="Nội tại / bị động"><b>🤖</b><div class="mb"><i id="opa"></i></div>Vân Giáp ⓘ</div>${comps().map((c,i)=>`<div class="pt"><b>${cIc(c)}</b><div class="mb"><i id="oc${i}a"></i></div>${cName(c)}</div>`).join("")}<div class="pt"><b>👾</b><div class="mb"><i id="oea"></i></div>${e.name}</div>`;
 $("#pp").innerHTML=`<div class="hd">${rankName(G.lv)}</div><div class="nm">Vân Giáp<small>${G.lv>=MAXR?"Tối cao":"KN "+G.xp+"/"+need()}</small></div>`+
 B("Lá chắn",G.sh,Math.max(G.shMax,G.sh),"--sh")+B("HP",G.hp,G.max,"--hp")+B("Năng lượng",G.en,G.enMax,"--en",`+${G.reg}`)+
 B("Hồn lực",G.soul,G.soulMax,"--so")+AT("pa",G.atb,G.spd)+(G.soul<G.soulMax*.25?'<div class="flag">Kiệt sức: sát thương -30%</div>':"")+(G.buffs.length?`<div class="bf">${G.buffs.map(b=>`${b.name} (${b.t-1})`).join(" · ")}</div>`:"");
 $("#ep").innerHTML=`<div class="hd">${e.tierName} · ${rankName(e.lv)}</div><div class="nm">${e.name}</div>`+
 B("Lá chắn",e.sh,e.shMax,"--sh")+B("HP",e.hp,e.max,"--bad")+B("Năng lượng",e.en,e.enMax,"--en")+AT("ea",e.atb,e.spd);
 const dp=$("#dp"),cs=comps();dp.style.display=cs.length?"":"none";
 dp.innerHTML=cs.map((c,i)=>`<div class="card panel"><div class="nm">${cIc(c)} ${cName(c)}</div>`+B("HP",c.hp,c.max,"--hp")+AT("c"+i,c.atb,c.spd)+`</div>`).join("");
 const sb=(s,i)=>{const st=`style="--rc:${s.r?RC[s.r]:"var(--bd)"}" title="${RN[s.r||0]}"`;return G.lv<(s.lv||0)?`<button class="sk" ${st} disabled><em>🔒</em><b>${s.name}</b><span>${rankShort(s.lv)}</span></button>`:
  `<button class="sk" ${st} ${can(s)?"":"disabled"} onclick="use(${i})"><em>${s.ic}</em><b>${s.name}</b><i>${VG.skill.TYPES[s.type].s}</i><span>${s.d}</span><span>NL ${s.en} · HL ${s.so}</span></button>`},
  bi=SK.map((s,i)=>[s,i]);
 $("#skills").innerHTML=[bi.filter(x=>x[0].eqid),bi.filter(x=>!x[0].eqid)].filter(l=>l.length).map(l=>`<div class="skg">${l.map(x=>sb(x[0],x[1])).join("")}</div>`).join("");
 const pv=$("#pasv"),pl=PAS.map(s=>`${s.ic} <b>${s.name}</b> <i style="color:var(--atb)">${VG.skill.TYPES[s.type].s}</i> — ${VG.skill.effText(s)}`).concat(cs.flatMap(c=>(c.sk||[]).map(s=>`${s.ic} <b>${s.name}</b> <i style="color:var(--atb)">${cName(c)} · ${VG.skill.TYPES[s.type].s}</i> — ${VG.skill.effText(s)}`)));
 pv.style.display=G.pv?"block":"none";pv.innerHTML=G.pv?`<div class="ph"><span>NỘI TẠI / BỊ ĐỘNG TỪ TRANG BỊ</span><button data-pc="1">✕</button></div>`+(pl.length?pl.map(x=>`<div class="it">${x}</div>`).join(""):'<div class="it" style="color:var(--mut)">Chưa có nội tại / bị động nào từ trang bị đang mặc.</div>'):"";
 const t=G.turn&&!G.modal&&!G.over;
 ["bBag","bSum","bRun","bEnd"].forEach(id=>$("#"+id).disabled=!t);
 $("#bSpd").textContent="x"+G.spdX;$("#bAuto").textContent="Auto "+(G.auto?"●":"○");
 tickUI()}
function tickUI(){
 const w=(id,v)=>{const n=$("#"+id);if(n)n.style.width=Math.min(100,Math.max(0,v/10))+"%"};
 const t=(id,v)=>{const n=$("#"+id+"t");if(n)n.textContent=Math.round(v)};
 w("pa",G.atb);t("pa",G.atb);w("opa",G.atb);w("ea",G.e.atb);t("ea",G.e.atb);w("oea",G.e.atb);
 comps().forEach((c,i)=>{w("c"+i,c.atb);t("c"+i,c.atb);w("oc"+i,c.atb)});}
document.addEventListener("click",e=>{if(!G)return;const t=e.target;if(t.closest("[data-pc]")){G.pv=false;renderAll();return}if(t.closest("[data-p]")){G.pv=!G.pv;renderAll();return}if(G.pv&&!t.closest("#pasv")){G.pv=false;renderAll()}});
$("#bBag").onclick=bag;$("#bSum").onclick=sumM;$("#bRun").onclick=run;$("#bEnd").onclick=endTurn;$("#bSet").onclick=setM;
$("#bSpd").onclick=()=>{G.spdX=({5:1,1:2,2:3,3:5})[G.spdX]||5;renderAll()};
$("#bAuto").onclick=()=>{G.auto=!G.auto;renderAll();if(G.auto&&G.turn)setTimeout(autoAct,300)};
GM.loadWorld().then(w=>(typeof GM.loadMonsters==='function'?Promise.resolve().then(()=>GM.loadMonsters(w)):Promise.resolve(w)).catch(()=>w).then(()=>w)).then(w=>{const z=w.zones[0];SV=GM.load(z);const pd=SV.pending;let def,mon;
 if(pd){def=w.events.find(v=>v.id===pd.id);mon=w.monsters.find(v=>v.id===pd.mon)}
 if(!def||!mon){PRACTICE=true;def=GM.rnd(w.events);mon=w.monsters.find(m=>m.id===GM.rnd(def.monsters))||w.monsters[0]}
 EV={def,mon,tier:w.tiers[def.tier]||{name:"?"},uid:pd&&pd.uid,from:pd&&pd.from,spawn:z.spawn};
 SCENE=new URLSearchParams(location.search).get("scene")||(pd&&pd.ter)||"grass";
 return Promise.all([GM.loadLib().catch(()=>null),loadScenes()]).then(([l])=>{LIB=l;if(!SC[SCENE])SCENE="grass";newGame();buildSkills();applyScene();renderAll();setInterval(tick,100)})}).catch(e=>{document.body.innerHTML='<p style="padding:20px">Không tải được dữ liệu: '+e.message+' <a href="index.html">Về bản đồ</a></p>'});
</script>
</body>
</html>
