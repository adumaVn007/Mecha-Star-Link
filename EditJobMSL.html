<!doctype html><html lang="vi"><head><title>Vân Giáp – Admin: Nghề</title><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><style>
:root{--bg:#f4f6fb;--card:#fff;--tx:#1b2333;--mu:#6b7488;--ac:#2563eb;--bd:#dde2ee;--ok:#16a34a;--er:#dc2626;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0f1420;--card:#192032;--tx:#e8ecf5;--mu:#98a2b8;--ac:#5b8def;--bd:#2a3550;--ok:#4ade80;--er:#f87171;color-scheme:dark}}
*{box-sizing:border-box}body{margin:0 auto;background:var(--bg);color:var(--tx);font:15px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif;padding:12px;max-width:680px}
h1{font-size:18px;margin:4px 0 10px}h2{font-size:15px;margin:0 0 8px}.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;margin-bottom:10px}
input,select,textarea{width:100%;padding:8px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);font:inherit}
.btn{padding:10px 12px;border:0;border-radius:10px;background:var(--ac);color:#fff;font-size:14px;min-height:42px}.btn.g{background:var(--bd);color:var(--tx)}.btn.r{background:var(--er)}.btn.s{padding:6px 10px;min-height:34px;font-size:13px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:flex-end}.row>*{flex:1;min-width:90px}.row>.fix{flex:none;min-width:0}
label{display:block;font-size:12px;color:var(--mu);margin-bottom:2px}.mu{color:var(--mu);font-size:13px}
.chips{display:flex;gap:6px;margin-bottom:10px;overflow-x:auto;padding-bottom:4px}.chips button{flex:none;padding:8px 14px;border-radius:20px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font:inherit}.chips button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.sub{border:1px solid var(--bd);border-radius:10px;padding:10px;margin-bottom:8px;background:var(--bg)}
#msg{margin-top:8px;padding:8px 10px;border-radius:8px;display:none;font-size:14px}#msg.ok{display:block;background:#16a34a22;color:var(--ok)}#msg.er{display:block;background:#dc262622;color:var(--er)}
</style></head><body>
<h1>⚒ Vân Giáp – Admin: Nghề</h1>
<div class="card mu" id="src">Đang tải dữ liệu…</div>
<div class="chips" id="jobs"></div>
<div id="ed"></div>
<div class="card">
<h2>Đồng bộ</h2>
<label>Token GitHub (chỉ lưu tạm trong phiên, không ghi vào code)</label><input id="tk" type="password" placeholder="ghp_… hoặc github_pat_…" autocomplete="off">
<div class="row" style="margin-top:8px"><button class="btn" id="bUp">⬆ Lưu LÊN GitHub</button><button class="btn g" id="bDn">⬇ Lấy TỪ GitHub</button></div>
<div class="row" style="margin-top:8px"><button class="btn g" id="bEx">Tải JSON xuống</button><button class="btn g" id="bIm">Dán JSON</button></div>
<textarea id="io" rows="5" style="display:none;margin-top:8px" placeholder="Dán nội dung jobs.json rồi bấm Dán JSON lần nữa"></textarea>
<div id="msg"></div>
<div class="mu" style="margin-top:8px">Dữ liệu ghi vào <code>database/jobs.json</code>. Game đọc tệp này để hiển thị bảng Nghề.</div>
</div>
<script src="vg-github.js"></script>
<script>
(function(){
var $=function(i){return document.getElementById(i)},PATH='database/jobs.json',DK='vg_jobs_draft';
var D={v:1,jobs:[]},cur=0,dirty=false;
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function msg(t,ok){var m=$('msg');m.textContent=t;m.className=ok?'ok':'er'}
function uid(p){return p+Math.random().toString(36).slice(2,7)}
function norm(j){if(!j||!Array.isArray(j.jobs))throw Error('Tệp không đúng định dạng (thiếu mảng jobs)');
 j.v=1;j.jobs.forEach(function(b){['levels','equips','recipes'].forEach(function(k){if(!Array.isArray(b[k]))b[k]=[]});b.id=b.id||uid('job');b.name=b.name||'Nghề';b.icon=b.icon||'⚒';b.desc=b.desc||''});return j}
function draft(){try{localStorage.setItem(DK,JSON.stringify(D))}catch(e){}dirty=true}
function field(l,p,v,t){return '<div><label>'+l+'</label><input data-p="'+p+'" '+(t=='n'?'type="number" inputmode="numeric" min="0"':'')+' value="'+esc(v)+'"></div>'}
function render(){
 var h='';D.jobs.forEach(function(b,i){h+='<button data-j="'+i+'" class="'+(i==cur?'on':'')+'">'+esc(b.icon)+' '+esc(b.name)+'</button>'});
 h+='<button data-addjob="1">＋ Thêm nghề</button>';$('jobs').innerHTML=h;
 var b=D.jobs[cur];if(!b){$('ed').innerHTML='<div class="card mu">Chưa có nghề nào. Bấm “＋ Thêm nghề”.</div>';return}
 var x='<div class="card"><h2>Thông tin nghề</h2><div class="row">'+field('Biểu tượng','info|icon',b.icon)+field('Tên nghề','info|name',b.name)+'</div><label style="margin-top:8px">Mô tả</label><textarea rows="2" data-p="info|desc">'+esc(b.desc)+'</textarea><div class="row" style="margin-top:8px"><button class="btn r s fix" data-deljob="1">Xóa nghề này</button></div></div>';
 x+='<div class="card"><h2>Cấp bậc của nghề</h2><div class="mu" style="margin-bottom:6px">Thứ tự từ trên xuống = cấp 1, 2, 3… “EXP” là kinh nghiệm cần để lên cấp kế tiếp (cấp cuối để 0).</div>';
 b.levels.forEach(function(l,i){x+='<div class="sub"><div class="row"><div class="fix" style="padding-bottom:8px">Cấp '+(i+1)+'</div>'+field('Tên cấp bậc','levels|'+i+'|name',l.name)+field('EXP lên cấp','levels|'+i+'|exp',l.exp,'n')+'<button class="btn r s fix" data-del="levels|'+i+'">Xóa</button></div></div>'});
 x+='<button class="btn" data-add="levels">＋ Thêm cấp bậc</button></div>';
 x+='<div class="card"><h2>Trang bị của nghề</h2>';
 b.equips.forEach(function(e,i){x+='<div class="sub"><div class="row">'+field('Tên trang bị','equips|'+i+'|name',e.name)+field('Loại','equips|'+i+'|slot',e.slot)+field('Yêu cầu cấp nghề','equips|'+i+'|reqLv',e.reqLv,'n')+'</div><label style="margin-top:6px">Mô tả</label><input data-p="equips|'+i+'|desc" value="'+esc(e.desc)+'"><div class="row" style="margin-top:6px"><button class="btn r s fix" data-del="equips|'+i+'">Xóa</button></div></div>'});
 x+='<button class="btn" data-add="equips">＋ Thêm trang bị</button></div>';
 x+='<div class="card"><h2>Công thức chế tạo</h2>';
 b.recipes.forEach(function(r,i){x+='<div class="sub"><div class="row">'+field('Tên công thức','recipes|'+i+'|name',r.name)+field('Cấp nghề mở khóa','recipes|'+i+'|reqLv',r.reqLv,'n')+field('EXP nhận được','recipes|'+i+'|exp',r.exp,'n')+'</div><div class="row" style="margin-top:6px">'+field('Nguyên liệu (ghi chữ)','recipes|'+i+'|mats',r.mats)+field('Thành phẩm','recipes|'+i+'|out',r.out)+'</div><div class="row" style="margin-top:6px"><button class="btn r s fix" data-del="recipes|'+i+'">Xóa</button></div></div>'});
 x+='<button class="btn" data-add="recipes">＋ Thêm công thức</button></div>';
 $('ed').innerHTML=x}
function load(src){return fetch(PATH+'?t='+Date.now()).then(function(r){if(!r.ok)throw 0;return r.json()}).catch(function(){return VG.fetchJSON(PATH)})}
function init(){var dr=null;try{dr=JSON.parse(localStorage.getItem(DK)||'null')}catch(e){}
 load().then(function(j){if(!j)throw Error('Chưa có database/jobs.json trên GitHub');D=norm(j);$('src').textContent='Đã tải database/jobs.json ('+D.jobs.length+' nghề).';render()})
 .catch(function(e){if(dr){try{D=norm(dr);$('src').textContent='Không tải được từ GitHub ('+e.message+'). Đang dùng bản nháp trên máy này.'}catch(x){}}else $('src').textContent='Lỗi tải dữ liệu: '+e.message;render()})}
document.addEventListener('input',function(e){var p=e.target.dataset&&e.target.dataset.p;if(!p)return;var a=p.split('|'),b=D.jobs[cur],v=e.target.value;if(e.target.type=='number')v=Math.max(0,+v||0);
 if(a[0]=='info')b[a[1]]=v;else b[a[0]][+a[1]][a[2]]=v;draft();if(a[0]=='info'&&a[1]!='desc'){var bt=$('jobs').querySelector('.on');if(bt)bt.textContent=b.icon+' '+b.name}});
document.addEventListener('click',function(e){var t=e.target.closest('button');if(!t)return;var b=D.jobs[cur];
 if(t.dataset.j!==undefined){cur=+t.dataset.j;render()}
 else if(t.dataset.addjob){if(!confirm('Thêm một nghề mới?'))return;D.jobs.push({id:uid('job'),name:'Nghề mới',icon:'⚒',desc:'',levels:[{name:'Cấp 1',exp:100}],equips:[],recipes:[]});cur=D.jobs.length-1;draft();render();msg('Đã thêm nghề mới (chưa lưu lên GitHub).',1)}
 else if(t.dataset.deljob){if(!confirm('Xóa nghề “'+b.name+'” cùng toàn bộ trang bị, công thức của nó?'))return;D.jobs.splice(cur,1);cur=0;draft();render();msg('Đã xóa nghề (chưa lưu lên GitHub).',1)}
 else if(t.dataset.add){var k=t.dataset.add;if(!confirm('Thêm mục mới?'))return;
  b[k].push(k=='levels'?{name:'Cấp '+(b.levels.length+1),exp:0}:k=='equips'?{id:uid('eq'),name:'Trang bị mới',slot:'Công cụ',reqLv:1,desc:'',img:''}:{id:uid('rc'),name:'Công thức mới',reqLv:1,exp:10,mats:'',out:'',desc:''});draft();render();msg('Đã thêm (chưa lưu lên GitHub).',1)}
 else if(t.dataset.del){var a=t.dataset.del.split('|');if(!confirm('Xóa mục này?'))return;b[a[0]].splice(+a[1],1);draft();render();msg('Đã xóa (chưa lưu lên GitHub).',1)}});
function check(){var bad=[];D.jobs.forEach(function(b){if(!b.levels.length)bad.push(b.name+': cần ít nhất 1 cấp bậc');var n=b.levels.length;b.recipes.forEach(function(r){if(+r.reqLv>n)bad.push(b.name+' / '+r.name+': cấp mở khóa vượt số cấp bậc')});b.equips.forEach(function(r){if(+r.reqLv>n)bad.push(b.name+' / '+r.name+': cấp yêu cầu vượt số cấp bậc')})});return bad}
$('tk').value=VG.getToken();
$('bUp').onclick=function(){var bad=check();if(bad.length)return msg('Không lưu được: '+bad[0]+(bad.length>1?' (+'+(bad.length-1)+' lỗi khác)':''),0);
 var tk=$('tk').value.trim();if(!tk)return msg('Chưa nhập token GitHub.',0);if(!confirm('Ghi đè database/jobs.json trên GitHub bằng dữ liệu đang sửa?'))return;
 VG.setToken(tk);msg('Đang lưu lên GitHub…',1);
 VG.save(PATH,D,'Cập nhật nghề (EditJobMSL)').then(function(){dirty=false;msg('✔ Thành công: đã lưu '+D.jobs.length+' nghề lên GitHub.',1)}).catch(function(e){msg('✘ Thất bại: '+e.message,0)})};
$('bDn').onclick=function(){if(dirty&&!confirm('Có thay đổi chưa lưu. Lấy từ GitHub sẽ ghi đè bản đang sửa?'))return;
 VG.fetchJSON(PATH).then(function(j){if(!j)throw Error('Chưa có database/jobs.json trên GitHub');D=norm(j);cur=0;dirty=false;draft();dirty=false;render();msg('✔ Thành công: đã lấy '+D.jobs.length+' nghề từ GitHub.',1)}).catch(function(e){msg('✘ Thất bại: '+e.message,0)})};
$('bEx').onclick=function(){var a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(D,null,1)],{type:'application/json'}));a.download='jobs.json';a.click();msg('✔ Đã tải jobs.json xuống máy.',1)};
$('bIm').onclick=function(){var t=$('io');if(t.style.display=='none'){t.style.display='block';return}
 try{var j=norm(JSON.parse(t.value));if(!confirm('Thay dữ liệu đang sửa bằng JSON vừa dán?'))return;D=j;cur=0;draft();render();t.value='';t.style.display='none';msg('✔ Thành công: đã nhập '+D.jobs.length+' nghề (chưa lưu lên GitHub).',1)}catch(e){msg('✘ Thất bại: '+e.message,0)}};
init();
})();
</script></body></html>
