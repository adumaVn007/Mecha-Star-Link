<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0a1117">
<title>Mecha Star Link · Vân Giáp</title>
<style>
:root{--bg:#0a1117;--p1:#263e47;--p2:#14242d;--gold:#e4c27b;--bronze:#98794b;--txt:#f3e7c9;--mut:#aab8b7;--jade:#77c5a6;
--sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px);--sal:env(safe-area-inset-left,0px);--sar:env(safe-area-inset-right,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;overflow:hidden;overscroll-behavior:none;background:var(--bg);color:var(--txt);font:13px/1.35 Georgia,"Noto Serif","Times New Roman",serif;user-select:none;-webkit-user-select:none}
#map{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;background:radial-gradient(ellipse at 50% 20%,#304b53,#0a1117 75%)}
.card{position:relative;background:linear-gradient(145deg,var(--p1),var(--p2));border:1px solid var(--bronze);border-radius:9px;box-shadow:0 2px 10px #000a,inset 0 0 0 1px #e4c27b22}
.card::before,.card::after{content:"";position:absolute;width:9px;height:9px;border:1px solid var(--gold);opacity:.7;pointer-events:none}
.card::before{left:3px;top:3px;border-right:0;border-bottom:0;border-top-left-radius:4px}
.card::after{right:3px;bottom:3px;border-left:0;border-top:0;border-bottom-right-radius:4px}
.card.hud,.hud{position:fixed;z-index:5}
.pill{background:#101d22e6;border:1px solid var(--bronze);border-radius:20px;padding:4px 10px;font-size:12px;white-space:nowrap;box-shadow:0 1px 6px #0008}
#lcol{position:fixed;z-index:5;top:calc(6px + var(--sat));left:calc(6px + var(--sal));width:calc(100% - clamp(158px,30vw,222px) - 24px);max-width:260px;display:flex;flex-direction:column;align-items:flex-start;gap:6px;pointer-events:none}
#lcol .hud{position:static}
#lcol #qtrack{pointer-events:auto}
.tl{display:flex;gap:6px;flex-wrap:wrap;pointer-events:none}
.rt{top:calc(6px + var(--sat));right:calc(6px + var(--sar));width:clamp(158px,30vw,222px);display:flex;flex-direction:column;gap:5px;max-height:calc(100dvh - 12px - var(--sat) - var(--sab));overflow:auto;scrollbar-width:none}
.rt::-webkit-scrollbar{display:none}
.stat{padding:7px 8px 6px}
.id{display:flex;gap:7px;align-items:center;cursor:pointer}
.av{width:38px;height:38px;flex:none;border:2px solid var(--gold);border-radius:50%;display:grid;place-items:center;font-size:19px;background:#34534d;overflow:hidden}
.av img{width:100%;height:100%;object-fit:cover}
.nm{min-width:0;flex:1}.nm b{display:block;color:var(--gold);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.nm small{display:block;color:var(--mut);font-size:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bars{margin-top:4px}.brow{display:flex;align-items:center;gap:4px;font-size:9.5px;color:var(--mut);margin-top:3px}
.brow span:first-child{width:24px;flex:none}.brow span:last-child{width:50px;text-align:right;flex:none;color:var(--txt)}
.bar{flex:1;height:6px;background:#0b171e;border-radius:6px;overflow:hidden}.bar i{display:block;height:100%;width:0;transition:width .25s}
.bar.xp i{background:linear-gradient(90deg,#66b997,#c5d58d)}.bar.hp i{background:linear-gradient(90deg,#c0584f,#e0948a)}.bar.ll i{background:linear-gradient(90deg,#4a8fc0,#9fd0ee)}
.cur{display:grid;grid-template-columns:repeat(4,1fr);gap:3px;margin-top:5px}
.cur div{background:#0d1b22;border:1px solid #77644388;border-radius:5px;text-align:center;padding:2px 0;line-height:1.15}
.cur b{display:block;font-size:11px}.cur small{display:block;font-size:8px;color:var(--mut)}
.mini .bars,.mini .cur{display:none}
.tbwrap{padding:5px}
.tbhead{display:flex;justify-content:space-between;align-items:center;font-size:10px;color:var(--mut);padding:0 2px 3px;cursor:pointer}
.tb{display:grid;grid-template-columns:repeat(auto-fill,minmax(36px,1fr));gap:4px}
.tbwrap.off .tb{display:none}
.tb button{height:42px;min-width:36px;padding:2px 0 0;background:linear-gradient(#354c52,#1a2d36);border:1px solid #8d754b;border-radius:7px;color:var(--txt);font:inherit;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative}
.tb button em{font-style:normal;font-size:17px;line-height:1}.tb button small{font-size:8px;color:var(--gold);line-height:1.1;margin-top:2px;white-space:nowrap}
.tb button.sk{border-color:#5f9d86}.tb button.act{background:linear-gradient(#b68d4d,#75542c)}
.tb button.lock{opacity:.45}
.tb button.rd::after{content:"";position:absolute;right:3px;top:3px;width:5px;height:5px;border-radius:50%;background:var(--jade)}
.tb button.pri{background:linear-gradient(#b78f50,#77552d)}
.tb button:active{transform:scale(.95)}
.bl{left:calc(6px + var(--sal));bottom:calc(6px + var(--sab));width:min(250px,44vw);padding:7px 9px;pointer-events:none}
.bl h4{margin:0 0 2px;color:var(--gold);font-size:12px}.bl p{margin:0;color:var(--mut);font-size:11px}.bl .co{color:var(--gold);font-size:11px;margin-top:2px}
.bl .lg{margin-top:4px;border-top:1px dotted #776644;padding-top:3px;font-size:10.5px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.zm{display:flex;flex-direction:column;gap:4px;margin-top:8px;pointer-events:auto}
.zm button{width:38px;height:38px;border-radius:8px;border:1px solid #8d754b;background:#101d22e6;color:var(--gold);font:bold 18px Georgia;cursor:pointer}
#toast{left:50%;bottom:calc(14px + var(--sab));transform:translateX(-50%);max-width:min(440px,70vw);background:#101d22f2;border:1px solid var(--gold);border-radius:10px;padding:8px 14px;text-align:center;opacity:0;pointer-events:none;transition:opacity .2s;z-index:9}
#toast.show{opacity:1}
#ov{position:fixed;inset:0;z-index:20;background:#000b;display:none;align-items:center;justify-content:center;padding:calc(10px + var(--sat)) calc(10px + var(--sar)) calc(10px + var(--sab)) calc(10px + var(--sal))}
#ov.show{display:flex}
.box{width:100%;max-width:560px;max-height:100%;display:flex;flex-direction:column;padding:12px 14px;background:linear-gradient(145deg,#263e47,#101d25);border:1px solid var(--gold);border-radius:12px;box-shadow:0 8px 30px #000c,inset 0 0 0 1px #e4c27b33}
.box>header{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}
.box h2{margin:0;color:var(--gold);font-size:16px;letter-spacing:.04em;text-shadow:0 0 10px #e4c27b55}
.x{width:40px;height:40px;flex:none;border-radius:8px;background:#65492e;color:#fff;border:1px solid var(--gold);font-size:15px;cursor:pointer}
.bd{overflow:auto;-webkit-overflow-scrolling:touch;min-height:0}
.bd p{margin:0 0 8px;color:var(--mut)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:7px;margin-bottom:6px}
.tile{background:#213842;border:1px solid #806b48;border-radius:8px;padding:9px 10px}.tile b{display:block;color:var(--gold);font-size:11px;margin-bottom:2px}
.row{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-bottom:1px dotted #776644}.row span:first-child{color:var(--mut)}
.btn{display:block;width:100%;text-align:left;padding:11px 12px;margin-top:7px;min-height:44px;background:linear-gradient(#354c52,#1a2d36);border:1px solid #8d754b;border-radius:8px;color:var(--txt);font:inherit;font-size:14px;cursor:pointer}
.btn.pri{background:linear-gradient(#b78f50,#77552d);font-weight:bold;text-align:center}.btn:disabled{opacity:.45;cursor:default}
.btn small{display:block;color:var(--mut);font-size:11px;margin-top:1px}
.tag{display:inline-block;border-radius:10px;padding:1px 8px;font-size:11px;font-weight:bold;color:#10181e;margin-right:6px}
.jb{border:1px solid #806b48;border-radius:9px;background:#213842;margin-bottom:8px}.jb>summary{list-style:none;cursor:pointer;padding:10px;min-height:48px;display:flex;align-items:center;gap:9px}.jb>summary::-webkit-details-marker{display:none}
.jb .ji{font-size:24px;width:30px;text-align:center}.jb .jm{flex:1;min-width:0}.jb .jm b{color:var(--gold);font-size:14px}.jb .jm small{display:block;color:var(--mut);font-size:11px}
.jb .jbar{height:6px;border-radius:4px;background:#0a1117;margin-top:4px;overflow:hidden}.jb .jbar i{display:block;height:100%;background:linear-gradient(90deg,#4f9a82,var(--gold))}
.jb .jc{padding:0 10px 10px}.jb h5{margin:8px 0 3px;color:var(--gold);font-size:12px}.jb .jr{padding:5px 0;border-bottom:1px dotted #776644;font-size:12px;color:var(--txt)}.jb .jr small{display:block;color:var(--mut);font-size:11px}.jb .lk{opacity:.55}.jb .cb{margin-top:5px;min-height:38px;padding:6px 10px;font-size:12px}
.note{border:1px dashed var(--bronze);border-radius:8px;padding:8px 10px;color:var(--mut);font-size:12px;margin-top:8px}
.sw{display:inline-block;width:11px;height:11px;border-radius:2px;margin-right:6px;vertical-align:-1px;border:1px solid #0006}
#qtrack{max-width:100%;padding:5px 8px;font-size:10.5px;cursor:pointer;z-index:4;display:none}#qtrack b{display:block;color:var(--gold);font-size:11px}#qtrack span{color:var(--mut)}
.tabs{display:flex;gap:6px;margin-bottom:8px}.tabs button{flex:1;padding:9px;min-height:40px;border-radius:7px;border:1px solid #8d754b;background:#1a2d36;color:var(--txt);font:inherit;cursor:pointer}.tabs button.on{background:linear-gradient(#b68d4d,#75542c)}
.tb .fsb{display:none}@media(orientation:landscape){.tb .fsb{display:flex}}
.tb button{height:calc(42px + (var(--ic,1) - 1)*24px)}.tb button em{font-size:calc(17px*var(--ic,1))}
.box{zoom:var(--fs,1)}
.seg{display:flex;gap:6px;flex:1;justify-content:flex-end}.seg button{min-height:40px;padding:6px 10px;border-radius:7px;border:1px solid #8d754b;background:#1a2d36;color:var(--txt);font:inherit;font-size:13px;cursor:pointer}.seg button.on{background:linear-gradient(#b68d4d,#75542c);font-weight:bold}
.cr{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px dotted #776644}.cr>span:first-child{color:var(--txt)}
.cr input[type=range]{flex:1;min-width:0;accent-color:#c9a45e;height:32px}.cr .vv{width:36px;text-align:right;color:var(--gold)}
.cs{margin:12px 0 2px;color:var(--gold);font-size:12px;letter-spacing:.06em}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:7px}.g2 .btn{margin-top:0;text-align:center;font-size:13px}
@media(max-height:430px){.zm{flex-direction:row;margin-top:4px}.zm button{width:34px;height:34px}.rt{width:clamp(150px,28vw,200px)}.stat{padding:5px 6px}.tb button{height:38px}.tb button small{display:none}.tb button em{font-size:18px}.bl p{display:none}}
</style>
</head>
<body>
<canvas id="map"></canvas>
<div id="lcol"><div class="hud tl"><span class="pill" id="pZone">Đang tải…</span><span class="pill" id="pDay"></span></div>
<div class="hud card" id="qtrack"></div>
<div class="hud zm"><button id="zIn" aria-label="Phóng to">+</button><button id="zOut" aria-label="Thu nhỏ">−</button><button id="zMe" aria-label="Về nhân vật">◎</button></div></div>
<div class="hud rt">
  <section class="card stat" id="stat">
    <div class="id" id="idrow"><div class="av" id="av">⚔</div><div class="nm"><b id="sName">Vân Giáp</b><small id="sRealm"></small></div></div>
    <div class="bars">
      <div class="brow"><span>KN</span><div class="bar xp"><i id="bXp"></i></div><span id="tXp"></span></div>
      <div class="brow"><span>HP</span><div class="bar hp"><i id="bHp"></i></div><span id="tHp"></span></div>
      <div class="brow"><span>LL</span><div class="bar ll"><i id="bLl"></i></div><span id="tLl"></span></div>
    </div>
    <div class="cur" id="cur"></div>
  </section>
  <section class="card tbwrap" id="tbwrap">
    <div class="tbhead" id="tbhead"><span>Thanh chức năng</span><span id="tbarrow">▾</span></div>
    <div class="tb" id="tb"></div>
  </section>
</div>
<div class="hud card bl" id="bl"><h4 id="tName">—</h4><p id="tDesc"></p><div class="co" id="tCo"></div><div class="lg" id="tLog"></div></div>
<div class="hud" id="toast"></div>
<div id="ov"><div class="box"><header><h2 id="oT"></h2><button class="x" id="oX" aria-label="Đóng">✕</button></header><div class="bd" id="oB"></div></div></div>

<script>
(function(){
"use strict";
const $=s=>document.querySelector(s),GM=VG.game;
const TW=64,TH=32;
const COL={grass:'#527e68',forest:'#315c4c',rock:'#777c78',ruin:'#9a825e',herb:'#6b9777',water:'#315f76',city:'#a08a62',portal:'#3d8f86',sand:'#a99a6a',snow:'#c9d8dc',swamp:'#46604a',road:'#9a8660',wall:'#8a7f62'};
const TN={grass:['Bãi cỏ linh khí','Linh khí lưu chuyển nhẹ.'],forest:['Rừng tùng cổ','Có dấu vết yêu thú và dược liệu.'],rock:['Vách đá linh thạch','Vách đá dựng đứng, không thể đi qua.'],ruin:['Di tích cổ','Tàn tích cổ đang tỏa ánh sáng.'],herb:['Ô linh thảo','Có linh thảo mọc quanh đây.'],water:['Vực nước sâu','Địa hình hiểm trở, không thể đi qua.'],city:['Thành trì','Có thể vào thành.'],portal:['Cổng bí cảnh','Ánh sáng xanh ngọc lưu chuyển.'],sand:['Bãi cát','Cát vàng, đi lại bình thường.'],snow:['Tuyết sơn','Tuyết phủ lạnh giá, vẫn đi được.'],swamp:['Đầm lầy','Bùn lầy ẩm ướt, vẫn đi được.'],road:['Đường mòn','Đường của lữ khách và thương nhân.'],wall:['Tường thành','Vòng tường biên giới quốc gia, chỉ đi qua được ở cổng thành trì.']};
const TIERS_ORDER=['small','medium','large','super'];
const IT={cell:['Pin năng lượng','+60 năng lượng'],tonic:['Tinh dịch hồn lực','+40 hồn lực'],nano:['Gói nano','+30% HP'],shcell:['Pin lá chắn','+80 lá chắn (chỉ dùng khi chiến đấu)']};
const SKILLS=[
 {id:'melee',ic:'🗡',n:'Cận chiến',d:'Chém Saber',lv:12},
 {id:'range',ic:'🏹',n:'Tầm xa',d:'Súng Beam',lv:12},
 {id:'shield',ic:'🛡',n:'Hộ thể',d:'Thủ thế',lv:14},
 {id:'pet',ic:'🐉',n:'Pet/Drone',d:'Triệu hồi drone',lv:12},
 {id:'item',ic:'🧪',n:'Vật phẩm',d:'Túi đồ nhanh',lv:0},
 {id:'ult',ic:'✦',n:'Tuyệt kỹ',d:'Pháo Hư Không',lv:16}];
const FUNCS=[['tinhchu','🌟','Tinh Chủ'],['char','🧙','Nhân vật'],['bag','🎒','Túi đồ'],['sect','🏯','Tông môn'],['craft','⚒','Nghề'],['quest','📜','Nhiệm vụ'],['ach','🏆','Thành tựu'],['map','🧭','Bản đồ'],['setting','⚙','Cấu hình']];

let world=null,zone=null,ST=null,tiles=[],wmap=null,pmap=null;
const isTown=p=>p&&(p.kind==='city'||p.kind==='capital'||p.kind==='fortress'||p.kind==='village');
const cv=$('#map'),g=cv.getContext('2d');
const CFGK='vg_cfg_v1',MSK='vg_manual_save';
const CFG=(()=>{const d={gfx:'high',orient:'auto',fs:1,ic:1,vol:{master:80,music:70,sfx:80}};try{const o=JSON.parse(localStorage.getItem(CFGK)||'null');if(o&&typeof o==='object'){Object.assign(d,o);d.vol=Object.assign({master:80,music:70,sfx:80},o.vol||{})}}catch(e){}return d})();
const GFX={low:{cap:1,fr:50,n:'Thấp'},mid:{cap:1.5,fr:33,n:'Vừa'},high:{cap:2.5,fr:30,n:'Cao'}};
const gfx=()=>GFX[CFG.gfx]||GFX.high;
function saveCfg(){try{localStorage.setItem(CFGK,JSON.stringify(CFG))}catch(e){}}
function applyCfg(){const r=document.documentElement.style;r.setProperty('--fs',CFG.fs);r.setProperty('--ic',CFG.ic)}
applyCfg();
let cw=0,ch=0,dpr=1,zoom=1,cam={x:0,y:0},follow=true;
let sel=null,route=[],mv=null,pv={x:0,y:0},modal=false,lastT=0,lastDraw=0;
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

let tt=0;
function toast(s){const t=$('#toast');t.textContent=s;t.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('show'),2400)}
function say(s){ST.log.unshift(s);if(ST.log.length>40)ST.log.length=40;$('#tLog').textContent='✦ '+s}
let saveWarn=false;
function persist(){if(!GM.save(ST)&&!saveWarn){saveWarn=true;toast("Trình duyệt đang chặn lưu dữ liệu: hãy bấm Nhân vật → Xuất file save để giữ tiến trình.")}}

function typ(x,y){
 if(x<0||y<0||x>=zone.w||y>=zone.h)return null;
 const pl=placeAt(x,y);if(pl)return isTown(pl)?'city':'portal';
 if(wmap)return wmap.ter[y*zone.w+x]||'grass';
 if(x<2||y<2||x>zone.w-3||y>zone.h-3)return'water';
 const n=(x*17+y*31+x*y*3)%31;
 return n<4?'forest':n===8?'rock':n===14?'ruin':n===19?'herb':'grass'}
/* FREE_MOVE=true: đi được mọi ô (kể cả núi/nước/tường). Đặt false để chặn lại địa hình hiểm trở. */
const FREE_MOVE=true;
const hard=t=>t==='water'||t==='rock'||t==='wall';
const blocked=t=>t===null||t===undefined||(!FREE_MOVE&&hard(t));
const placeAt=(x,y)=>pmap?pmap[x*1000+y]:zone.places.find(p=>p.x===x&&p.y===y);
/* ===== Quái trên bản đồ: cấu hình, kích thước theo bậc, di chuyển, mật độ theo vùng (database/monsters.json) ===== */
const MCFG={mult:3,reroll:.35,roamMin:1100,roamMax:2600,roamChance:.55,townSafe:2,saveMs:10000};
let monById=new Map(),evMap=new Map(),nextRoam=0,lastSaveT=0,moved=false;
const monOf=e=>monById.get(e.mon);
function addEv(e){const m=monOf(e),r=m?GM.monFoot(m):0;for(let dx=-r;dx<=r;dx++)for(let dy=-r;dy<=r;dy++)evMap.set((e.x+dx)*1000+(e.y+dy),e)}
function rebuildEv(){evMap=new Map();if(ST)ST.events.forEach(addEv)}
const evAt=(x,y)=>evMap.get(x*1000+y);
/* khóa nền chiến đấu (battle.html + database/combat-ui.json): địa hình tại ô người chơi, gần thành trì (≤4 ô) thì dùng 'city' */
const sceneKey=(x,y)=>{const k=typ(x,y);return nearTown(x,y,4)?'city':(!k||k==='portal'?'grass':k)};
function nearTown(x,y,r){for(let dx=-r;dx<=r;dx++)for(let dy=-r;dy<=r;dy++)if(pmap&&pmap[(x+dx)*1000+(y+dy)])return true;return false}
function footOK(x,y,r,self){
 for(let dx=-r;dx<=r;dx++)for(let dy=-r;dy<=r;dy++){const a=x+dx,b=y+dy;
  if(a<2||b<2||a>zone.w-3||b>zone.h-3)return false;
  const t=typ(a,b);if(t===null||hard(t)||t==='city'||t==='portal'||t==='wall'||VG.quest.res[a*1000+b])return false;
  const o=evMap.get(a*1000+b);if(o&&o!==self)return false;
  if(Math.abs(a-ST.pos.x)+Math.abs(b-ST.pos.y)<1)return false}
 return !nearTown(x,y,MCFG.townSafe+r)}
/* Vùng xa sự quản lý của quốc gia (ngoài lãnh thổ, xa thành) -> quái xuất hiện dày hơn */
function wildW(x,y){
 if(!wmap)return 1;
 const own=wmap.owner[y*zone.w+x];let d=1e9;for(const p of zone.places){const k=Math.abs(p.x-x)+Math.abs(p.y-y);if(k<d)d=k}
 const far=Math.max(0,Math.min(1,(d-8)/40));

function bfs(a,b){
 if(blocked(tiles[b.x][b.y]))return null;
 const key=(x,y)=>x*1000+y,prev=new Map([[key(a.x,a.y),null]]),q=[a];
 for(let i=0;i<q.length;i++){const c=q[i];if(c.x===b.x&&c.y===b.y)break;
  for(const[dx,dy]of[[1,0],[-1,0],[0,1],[0,-1]]){const n={x:c.x+dx,y:c.y+dy};
   if(n.x<0||n.y<0||n.x>=zone.w||n.y>=zone.h||prev.has(key(n.x,n.y))||blocked(tiles[n.x][n.y]))continue;
   prev.set(key(n.x,n.y),c);q.push(n)}}
 if(!prev.has(key(b.x,b.y)))return null;
 const out=[];let c=b;while(c&&!(c.x===a.x&&c.y===a.y)){out.unshift({x:c.x,y:c.y});c=prev.get(key(c.x,c.y))}
 return out}

 if(ptrs.size===0)tap=null}
cv.addEventListener('pointerup',e=>up(e,true));cv.addEventListener('pointercancel',e=>up(e,false));
cv.addEventListener('wheel',e=>{e.preventDefault();zoomAt(e.clientX,e.clientY,e.deltaY<0?1.1:1/1.1)},{passive:false});
cv.addEventListener('contextmenu',e=>e.preventDefault());

function loop(now){
 requestAnimationFrame(loop);
 if(document.hidden||!zone||!ST)return;
 const dt=Math.min(.1,(now-(lastT||now))/1000);lastT=now;
 stepUpdate(now);roamStep(now);
 if(follow){const k=1-Math.pow(.0008,dt);cam.x+=(wx(pv.x,pv.y)-cam.x)*k;cam.y+=(wy(pv.x,pv.y)+TH/2-cam.y)*k}
 if(now-lastDraw<gfx().fr)return;lastDraw=now;draw(now)}

function fail(msg){$('#pZone').textContent='Lỗi dữ liệu';openModal('Không tải được dữ liệu',`<p>${esc(msg)}</p><div class="note">Cần file <b>database/world-events.json</b> cùng thư mục với index.html (hoặc đã up lên GitHub). Nếu mở file trực tiếp từ bộ nhớ điện thoại, trình duyệt sẽ chặn đọc file: hãy mở qua link Cloudflare/GitHub Pages.</div><button class="btn pri" onclick="location.reload()">Thử lại</button>`)}
function init(w){
 world=w;monById=new Map((w.monsters||[]).map(m=>[m.id,m]));zone=wmap?wmap.zone:w.zones[0];zone.eventCount=Math.round((zone.eventCount||0)*MCFG.mult);pmap={};zone.places.forEach(p=>{pmap[p.x*1000+p.y]=p});
 tiles=[];for(let x=0;x<zone.w;x++){tiles[x]=[];for(let y=0;y<zone.h;y++)tiles[x][y]=typ(x,y)}
 ST=GM.load(zone);
 if(ST.zone!==zone.id){const k=ST;ST=GM.defaults(zone);ST.char=k.char;ST.p=k.p;ST.items=k.items;ST.stones=k.stones;ST.auto=k.auto;ST.autoSet=k.autoSet;ST.day=k.day;ST.kills=k.kills;ST.cleared=k.cleared;if(k.jobs)ST.jobs=k.jobs;['inv','eq','petBag','eqB','q','city','starter'].forEach(x=>{if(k[x])ST[x]=k[x]})}
 VG.quest.ensure(ST);
 if(VG.bag.grantStarter(ST))GM.save(ST);
 if(!ST.char)return startCreate();
 boot()}
function startCreate(){
 $('#pZone').textContent='Tạo nhân vật';
 const W=zone.w,cs=[];
 if(wmap&&wmap.names.length>1){for(let id=1;id<wmap.names.length;id++){
  const cap=zone.places.find(p=>p.kind==='capital'&&p.country===id);
  cs.push({id,name:wmap.names[id],color:wmap.cols[id],capital:cap?cap.name:'',cities:zone.places.filter(p=>p.country===id&&isTown(p)&&p!==cap).length})}}
 else cs.push({id:0,name:zone.name,color:'#77c5a6',capital:'',cities:0});
 function spawnFor(id){
  const cap=zone.places.find(p=>p.kind==='capital'&&p.country===id),sp=zone.spawn;
  if(!cap||!wmap)return{x:sp.x,y:sp.y};
  let best=null,bd=1e9;
  for(let r=1;r<=8&&!best;r++)for(let dx=-r;dx<=r;dx++)for(let dy=-r;dy<=r;dy++){
   if(Math.max(Math.abs(dx),Math.abs(dy))!==r)continue;
   const x=cap.x+dx,y=cap.y+dy,t=typ(x,y);
   if(t===null||hard(t)||t==='city'||t==='portal'||placeAt(x,y))continue;
   if(wmap.owner[y*W+x]!==id)continue;
   const d=Math.abs(dx)+Math.abs(dy);if(d<bd){bd=d;best={x,y}}}
  return best}
 VG.char.open({countries:cs,spawnFor,done:(c,org,sp)=>{
  VG.char.apply(ST,c,org,sp,zone.id);
  const cn=(cs.find(v=>v.id===c.country)||{}).name||'';
  ST.log=[];say('Khởi đầu tại '+cn+'.');persist();boot()}})}
function boot(){
 const r=ST.result;
 if(r){
  if(r.type==='win'){ST.events=ST.events.filter(e=>e.uid!==r.uid);ST.kills++;ST.cleared++;{const md=world.monsters.find(m=>m.id===r.mon)||world.monsters.find(m=>m.name===r.name)||{};VG.quest.kill(md.id||r.mon||'',!!md.boss||String(r.uid||'').indexOf('boss_')===0,r.name)}if(String(r.uid||'').indexOf('boss_')===0){ST.bossDown=ST.bossDown||{};ST.bossDown[r.uid.slice(5)]={day:ST.day,kills:ST.kills}}
   const s=r.stone||{},parts=[];['thuong','trung','cao','sieu'].forEach((k,i)=>{if(s[k])parts.push('+'+s[k]+' LT '+['Thường','Trung','Cao','Siêu'][i])});
   say('Hạ '+r.name+': +'+r.xp+' KN'+(parts.length?', '+parts.join(', '):'')+'.')}
  else if(r.type==='flee')say('Thoát khỏi giao tranh với '+r.name+'.');
  else if(r.type==='lose')say('Mecha bị hạ gục, hồi sinh tại điểm xuất phát.');
  ST.result=null}
 else if(ST.pending){ST.pos=ST.pending.from||ST.pos;say('Rời trận giữa chừng, quay lại bản đồ.')}
 ST.pending=null;if(!ST.autoSet)ST.auto=true;ST.aggroCd=Date.now()+8000;
 if(!ST.log.length)say('Tiến vào '+zone.name+'.');else $('#tLog').textContent='✦ '+ST.log[0];
 ST.events=ST.events.filter(e=>world.events.some(v=>v.id===e.id)&&world.monsters.some(m=>m.id===e.mon)&&tiles[e.x]&&!blocked(tiles[e.x][e.y]));
 if(blocked(tiles[ST.pos.x]&&tiles[ST.pos.x][ST.pos.y]))ST.pos={x:zone.spawn.x,y:zone.spawn.y};
 ensureBosses();rebuildEv();spawnEvents();persist();
 pv={x:ST.pos.x,y:ST.pos.y};zoom=Math.min(cw,ch)<520?.85:1;focusPlayer();select({x:ST.pos.x,y:ST.pos.y});
 $('#pZone').textContent=zone.name;renderHUD();VG.quest.refresh();VG.quest.achCheck();
 !ST.char&&GM.loadLib().then(l=>{const h=l&&l.humans&&l.humans[0];if(h&&typeof h.img==='string'&&h.img.indexOf('data:image')===0){const i=new Image();i.src=h.img;$('#av').textContent='';$('#av').appendChild(i)}}).catch(()=>{})}
buildTaskbar();resize();
window.addEventListener('resize',resize);window.addEventListener('orientationchange',()=>setTimeout(resize,200));
window.addEventListener('pageshow',e=>{if(e.persisted)location.reload()});
VG.quest.init({ST:()=>ST,GM,IT,monName:id=>{const m=world&&world.monsters.find(v=>v.id===id);return m?m.name:''},placeName:id=>{const p=zone&&zone.places.find(v=>v.id===id);return p?p.name:''},placeHere:()=>{const p=ST&&zone?placeAt(ST.pos.x,ST.pos.y):null;return p?p.id:''},openModal,closeModal,toast,say,persist,renderHUD,rest,jobName:id=>{const b=JOBS&&JOBS.jobs&&JOBS.jobs.find(j=>j.id===id);return b?b.name:''}});
$('#qtrack').onclick=()=>{if(modal||!ST||!ST.q||!ST.q.pin)return;const d=VG.quest.detail(ST.q.pin);openModal(d[0],d[1])};
loadJobs();loadBps();GM.restore().catch(()=>0).then(()=>GM.loadWorld()).then(w=>(typeof GM.loadMonsters==='function'?Promise.resolve().then(()=>GM.loadMonsters(w)):Promise.resolve(w)).catch(()=>w).then(()=>w)).then(w=>loadMap().then(()=>VG.quest.load().catch(()=>0)).then(()=>init(w))).catch(e=>fail(e.message||String(e)));
requestAnimationFrame(loop);
window.__vg={get ST(){return ST},get zone(){return zone},hit,onTap,get mv(){return mv},get route(){return route},wx,wy,toSX,toSY,get zoom(){return zoom},get modal(){return modal}};
})();
