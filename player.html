return row('HP',num('hp'))+row('MP mỗi đòn',num('mpAtk'))+row('Sát thương',num('dmg'))+row('Hệ sát thương',esc(DT[p.dmgType||'nontype']||p.dmgType))+row('Dạng sát thương',esc(DS[p.dmgShape||'single']||p.dmgShape))+row('Chính xác',num('acc'))+row('Skill',sk?esc(sk.name):(p.skill?esc(p.skill):'—'))+(dev?row('Độ bền (ẩn)',num('dur')):'')}
function fmt(k,v){if(k=='slot')return sn(v);if(k=='rank')return 'Thánh Giai bậc '+v;if(k=='realm')return rankName(v);if(k=='dtype')return {sentry:'Sentry',repair:'Repair',shield:'Shield'}[v]||v;if(k=='branch')return (BR.filter(function(b){return b[0]==v})[0]||[0,v])[1];if(k=='dmgType')return DT[v]||v;if(k=='dmgShape')return DS[v]||v;if(k=='skill'){var s=find(v);return s?s.name:v}return v}
function r1(){var e=D.pilot,c=compute(D),nd=need(D),pr={str:1,agi:1,int:1};
var h='<div class="card"><div style="display:flex;justify-content:space-between;gap:8px"><b>👤 '+esc(e.name)+'</b><span class="mu" style="text-align:right">'+esc(rankName(e.rank))+' · Cấp '+e.level+'</span></div><div class="mu" style="margin:6px 0 3px">EXP '+e.exp+' / '+nd+'</div><div class="bar"><i style="width:'+Math.min(100,e.exp/nd*100)+'%"></i></div></div>';
h+='<div class="card"><b>Chỉ số: Phi công → Mecha</b><div class="stat h" style="margin-top:6px"><span></span><span></span><span>Phi công</span><span>Mecha</span></div>'+D.stats.map(function(s){var p=c.P[s.k],m=c.M[s.k],x=m.na?0:bonus(s.k);
return '<div class="stat"><span'+(pr[s.k]?' style="font-weight:600"':'')+'>'+esc(s.l)+'</span><div class="bar"><i style="width:'+Math.min(100,(m.na?p.v:m.v+x)/(s.max||100)*100)+'%"></i></div><span>'+p.v+'</span><b>'+(m.na?'—':rd(m.v+x)+(x?' <span class="pos">(+'+x+')</span>':''))+((p.err||m.err)?' ⚠':'')+'</b></div>'}).join('')+'</div>';
var sl=BASESLOTS.slice();(lib().equips||[]).forEach(function(i){if(i.slot&&sl.indexOf(i.slot)<0)sl.push(i.slot)});
h+='<div class="card"><b>Trang bị Mecha</b>'+sl.map(function(s){var it=eqIt(s);return '<div class="slot"><span class="mu">'+esc(sn(s))+'</span><span>'+(it?esc(it.name):(EQ[s]?'(không còn trong thư viện)':'— trống —'))+'</span></div>'}).join('')+'</div>';
[['pet','🐾 Pet'],['drone','🛸 Drone']].forEach(function(z){var it=find(PD[z[0]]);h+='<div class="card"><b>'+z[1]+'</b>'+(it?'<div style="margin:4px 0">'+esc(it.name)+'</div>'+pdHtml(it):'<div class="mu">— chưa mang — (chọn trong Thư viện)</div>')+'</div>'});
$('v1').innerHTML=h;
$('src').innerHTML='Công thức: '+esc(fsrc)+'.<br>Thư viện: '+esc(srcTxt)}
function img(it,c){return it.img&&/^(data:image\/|https:)/.test(it.img)?'<img class="'+(c||'')+'" src="'+esc(it.img)+'" alt="">':''}
function chips(a,arr,cur){return '<div class="chips">'+arr.map(function(c){return '<button data-'+a+'="'+esc(c[0])+'" class="'+(cur==c[0]?'on':'')+'">'+esc(c[1])+'</button>'}).join('')+'</div>'}
function bn(k){return (BR.filter(function(b){return b[0]==k})[0]||[0,k])[1]}
function r2(){var L=lib(),all=[],cnt={};
Object.keys(L).forEach(function(k){var c=CATS.filter(function(x){return x[0]==k})[0]||[k,k,'📦'];cnt[k]=L[k].length;L[k].forEach(function(it){all.push({k:k,ic:c[2],it:it})})});
var h='<div class="row mu" style="margin-bottom:8px"><label><input type="checkbox" id="cs" '+(showSample?'checked':'')+' style="width:auto">Mục mẫu</label><label><input type="checkbox" id="cd" '+(dev?'checked':'')+' style="width:auto">Chỉ số ẩn</label><button class="btn g" id="rl" style="flex:0 0 auto">Tải lại từ GitHub</button></div>';
h+=chips('c',[['all','Tất cả ('+all.length+')']].concat(Object.keys(L).map(function(k){var c=CATS.filter(function(x){return x[0]==k})[0];return [k,(c?c[1]:k)+' ('+cnt[k]+')']})),cat);
if(cat=='equips'){var ss={};L.equips.forEach(function(i){ss[i.slot||'?']=1});h+=chips('sl',[['all','Mọi ô']].concat(Object.keys(ss).map(function(s){return [s,sn(s)]})),slotF)}
if(cat=='materials'){h+=chips('br',[['all','Mọi nhánh']].concat(BR.map(function(b){return [b[0],b[1]+' ('+L.materials.filter(function(i){return i.branch==b[0]}).length+')']})),brF);if(brF=='skill')h+=chips('gr',[['all','Mọi bậc']].concat(GR.map(function(g,i){return [''+i,g]})),grF)}
var list=all.filter(function(x){var it=x.it;if(cat!='all'&&x.k!=cat)return false;if(cat=='equips'&&slotF!='all'&&(it.slot||'?')!=slotF)return false;
if(cat=='materials'){if(brF!='all'&&it.branch!=brF)return false;if(brF=='skill'&&grF!='all'&&(it.realm===''||it.realm===undefined||gradeOf(it.realm)!=+grF))return false}return true});
function sub(x){var it=x.it;if(x.k=='equips')return EQ[it.slot]==it.id?'✔ Đang mang':sn(it.slot||'?');if(x.k=='materials')return bn(it.branch)+(it.realm!==''&&it.realm!==undefined?' · '+rankName(it.realm):'');
if(x.k=='pets'||x.k=='drones')return PD[x.k=='pets'?'pet':'drone']==it.id?'✔ Đang mang':(x.k=='pets'?'Pet':'Drone');return (CATS.filter(function(c){return c[0]==x.k})[0]||[0,x.k])[1]}
h+=list.length?'<div class="grid">'+list.map(function(x){var it=x.it;return '<div class="it'+(sel==it.id?' sel':'')+'" data-i="'+esc(it.id)+'"><div class="ic">'+(img(it)||x.ic)+'</div>'+esc(it.name||'(chưa đặt tên)')+'<div class="mu">'+esc(sub(x))+'</div></div>'}).join('')+'</div>':'<div class="mu">Chưa có mục nào ở đây. Thêm bằng Mecha Studio rồi đồng bộ lên GitHub.</div>';
var it=sel&&find(sel);if(it){var isEq=L.equips.indexOf(it)>=0,isPet=L.pets.indexOf(it)>=0,isDr=L.drones.indexOf(it)>=0,isPD=isPet||isDr,isMat=L.materials.indexOf(it)>=0,kind=isPet?'pet':'drone',eq=isEq&&EQ[it.slot]==it.id,on=isPD&&PD[kind]==it.id;
h+='<div class="card" style="margin-top:10px">'+img(it,'dimg')+'<b>'+esc(it.name||'(chưa đặt tên)')+'</b>'+Object.keys(it).filter(function(k){return k!='img'&&k!='id'&&k!='name'&&it[k]!==''&&it[k]!==0&&it[k]!==null&&typeof it[k]!='object'&&!/^fx/.test(k)&&!(isPD&&PDK.indexOf(k)>=0)&&!(k=='dur')}).map(function(k){return '<div class="kv"><span class="mu">'+esc(LB[k]||k)+'</span><span>'+esc(fmt(k,it[k]))+'</span></div>'}).join('');
if(isPD){h+='<div class="mu" style="margin-top:8px">Chỉ số sau khi cộng nguyên liệu chế tạo</div>'+pdHtml(it);
if((it.recipe||[]).length)h+='<div class="mu" style="margin-top:8px">Nguyên liệu chế tạo</div>'+it.recipe.map(function(x){var m=find(x.m);return '<div class="kv"><span>'+(m?esc(m.name):esc(x.m)+' (không có trong thư viện)')+'</span><span>x'+(+x.q||1)+'</span></div>'}).join('');
h+='<button class="btn" style="margin-top:8px" id="pdb">'+(on?'Tháo ra':'Mang theo')+'</button>'}
if(isMat){var f=Object.keys(FXK).filter(function(k){return fxv(it,k)&&(dev||k!='dur')}).map(function(k){var v=fxv(it,k);return esc(FXL[k]||k)+' '+(v>0?'+':'')+v});if(f.length)h+='<div class="pos" style="margin-top:8px">Ảnh hưởng Pet/Drone: '+f.join(', ')+'</div>'}
if(isEq)h+='<button class="btn" style="margin-top:8px" id="eqb">'+(eq?'Tháo ra':'Trang bị cho Mecha')+'</button>';h+='</div>'}
$('v2').innerHTML=h}
function sv(k,o){try{localStorage.setItem(k,JSON.stringify(o))}catch(e){}}
$('v2').addEventListener('click',function(ev){var t=ev.target,q=function(a){return t.closest('['+a+']')},c=q('data-c'),s=q('data-sl'),b=q('data-br'),g=q('data-gr'),i=q('data-i');
if(c){cat=c.dataset.c;slotF=brF=grF='all';r2()}else if(s){slotF=s.dataset.sl;r2()}else if(b){brF=b.dataset.br;grF='all';r2()}else if(g){grF=g.dataset.gr;r2()}else if(i){sel=i.dataset.i;r2()}
else if(t.id=='eqb'){var it=find(sel);if(EQ[it.slot]==it.id)delete EQ[it.slot];else EQ[it.slot]=it.id;sv('vg_equip2',EQ);r2();r1()}
else if(t.id=='pdb'){var p=find(sel),k=lib().pets.indexOf(p)>=0?'pet':'drone';if(PD[k]==p.id)delete PD[k];else PD[k]=p.id;sv('vg_pd',PD);r2();r1()}
else if(t.id=='rl'){gh(true)}});
$('v2').addEventListener('change',function(ev){if(ev.target.id=='cs')showSample=ev.target.checked;else if(ev.target.id=='cd')dev=ev.target.checked;else return;r1();r2()});
function gh(manual){var m=function(t){$('msg').textContent=t};if(manual)m('Đang tải từ GitHub…');
VG.loadDB().then(function(j){if(!j)throw Error('không thấy '+VG.cfg.paths.db);LIB=j;srcTxt='GitHub (mecha-studio.json tải trực tiếp).';if(manual)m('✅ Đã tải thư viện.');r1();r2()}).catch(function(e){if(manual)m('❌ '+e.message+' (demo trên claude.ai chặn kết nối ra ngoài; chạy trên Cloudflare/GitHub Pages thì dùng được)')});
VG.loadFormula().then(function(j){if(valid(j)){D=j;own=true;fsrc='GitHub (stat-formula.json)';r1();r2()}}).catch(function(){})}
$('imb').onclick=function(){var io=$('io');if(io.style.display=='none'){io.style.display='block';io.value='';$('msg').textContent='Dán JSON công thức hoặc mecha-studio.json rồi bấm lại nút.';return}
try{var j=JSON.parse(io.value);if(valid(j)){D=j;own=true;fsrc='JSON bạn vừa dán';sv(KEY,D);$('msg').textContent='✅ Đã áp dụng công thức.'}
else if(j&&typeof j=='object'&&(Array.isArray(j.equips)||Array.isArray(j.humans)||Array.isArray(j.items)||Array.isArray(j.materials)||Array.isArray(j.pets))){LIB=j;srcTxt='JSON bạn vừa dán.';$('msg').textContent='✅ Đã nạp thư viện.'}else throw Error('không nhận ra định dạng');r1();r2()}catch(e){$('msg').textContent='❌ JSON không hợp lệ: '+e.message}};
function tab(n){$('v1').style.display=n==1?'':'none';$('v2').style.display=n==2?'':'none';$('t1').className=n==1?'on':'';$('t2').className=n==2?'on':''}
if(own)fsrc='đã lưu từ trang Công thức';
$('t1').onclick=function(){tab(1)};$('t2').onclick=function(){tab(2)};tab(1);r1();r2();try{gh(false)}catch(e){}
</script></body></html>
