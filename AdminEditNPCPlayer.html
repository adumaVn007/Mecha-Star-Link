      if (r.status == 404) return null;

if(!confirm((ned.orig?'Cập nhật':'Thêm')+' NPC "'+o.name+'" tại '+zname(o.zone)+' ô ('+o.x+', '+o.y+')?'))return;

catch(e){NPC=JSON.parse(snap);nm='<span class="er">❌ Thất bại, không lưu được: '+esc(e.message)+'</span>';ned.cur=o}
nview();return}
if(a=='del'){var d=NPC.npcs[+i];if(!d||!confirm('Xóa NPC "'+d.name+'"?'))return;snap=JSON.stringify(NPC);try{NPC.npcs.splice(+i,1);npersist();nm='<span class="ok">✅ Đã xóa NPC "'+esc(d.name)+'".</span>'}catch(e){NPC=JSON.parse(snap);nm='<span class="er">❌ Thất bại: '+esc(e.message)+'</span>'}nview();return}

try{var j=JSON.parse(io2.value);if(!nvalid(j))throw Error('thiếu mảng "npcs"');if(!confirm('Thay toàn bộ '+NPC.npcs.length+' NPC trên máy bằng '+j.npcs.length+' NPC vừa dán?'))return;snap=JSON.stringify(NPC);NPC={v:1,npcs:j.npcs};try{npersist()}catch(e){NPC=JSON.parse(snap);throw e}nm='<span class="ok">✅ Đã nhập '+j.npcs.length+' NPC.</span>'}catch(e){nm='<span class="er">❌ Nhập thất bại: '+esc(e.message)+'</span>'}nview();return}
if(a=='tok'){VG.clearToken();nm='Đã xóa token khỏi tab này.';nview2();return}
if(a=='pull'){nm='Đang tải từ GitHub…';nview2();VG.fetchJSON(VG.cfg.paths.npc).then(function(j){if(!j){nm='Chưa có '+VG.cfg.paths.npc+' trên GitHub.';nview2();return}if(!nvalid(j))throw Error('File trên GitHub không đúng định dạng.');if(!confirm('Thay '+NPC.npcs.length+' NPC trên máy bằng '+j.npcs.length+' NPC từ GitHub?')){nm='Đã hủy.';nview2();return}var sn=JSON.stringify(NPC);NPC={v:1,npcs:j.npcs};try{npersist();nm='<span class="ok">✅ Đã lấy '+j.npcs.length+' NPC từ GitHub.</span>'}catch(e){NPC=JSON.parse(sn);nm='<span class="er">❌ Không lưu được: '+esc(e.message)+'</span>'}nview()}).catch(function(e){nm='<span class="er">'+esc(gerr2(e))+'</span>';nview2()});return}
if(a=='push'){var tk=VG.getToken();if(!tk){tk=prompt('Dán token GitHub (fine-grained, chỉ quyền Contents: Read and write cho repo này). Token chỉ lưu trong tab này.');if(!tk)return;VG.setToken(tk.trim())}
if(!confirm('Ghi đè '+VG.cfg.paths.npc+' trên nhánh '+VG.cfg.branch+' bằng '+NPC.npcs.length+' NPC?'))return;nm='Đang đẩy…';nview2();
VG.save(VG.cfg.paths.npc,NPC,'Cập nhật dữ liệu NPC').then(function(j){nm='<span class="ok">✅ Đã tải lên GitHub'+(j&&j.commit?' (commit '+String(j.commit.sha).slice(0,7)+')':'')+'.</span>';nview2()}).catch(function(e){nm='<span class="er">'+esc(gerr2(e))+'</span>';nview2()})}}

/* ===== Thư viện: chỉnh sửa trang bị, ghi thẳng database/mecha-studio.json ===== */
var em=false,fa=null,faImg='',lm='';
var WT=[['','Không'],['gun','Súng'],['blade','Kiếm'],['core','Lõi'],['missile','Tên lửa'],['cannon','Pháo']];
function euid(){return Math.random().toString(36).slice(2,9)}
function etok(){var tk=VG.getToken();if(!tk){tk=prompt('Dán token GitHub (fine-grained, chỉ quyền Contents: Read and write cho repo này). Token chỉ lưu trong tab này.');if(!tk)return '';tk=tk.trim();VG.setToken(tk)}return tk}
function gerr3(e){var m=e&&e.message?e.message:String(e);return /fetch|network/i.test(m)?m+' (trang demo trên claude.ai chặn kết nối ra ngoài; chạy trên Cloudflare/GitHub Pages thì dùng được)':m}
/* Đọc bản MỚI NHẤT từ GitHub -> mut(db) chỉ sửa phần cần đổi -> ghi lại kèm sha (xung đột thì 409, không ghi đè). */
function ghPatch(mut,msg){var c=VG.cfg,p=c.paths.db,api='https://api.github.com/repos/'+c.owner+'/'+c.repo+'/contents/'+p,tk=VG.getToken(),q='?ref='+encodeURIComponent(c.branch),sha,db,H;
if(c.writable.indexOf(p)<0)return Promise.reject(Error('Đường dẫn không được phép ghi: '+p));if(!tk)return Promise.reject(Error('Chưa có token GitHub'));
H={Authorization:'Bearer '+tk,Accept:'application/vnd.github+json'};
return fetch(api+q,{headers:H,cache:'no-store'}).then(function(r){if(!r.ok)throw Error('Đọc sha lỗi '+r.status+(r.status==401?' (token sai hoặc hết hạn)':''));return r.json()}).then(function(m){sha=m.sha;return fetch(api+q,{headers:{Authorization:'Bearer '+tk,Accept:'application/vnd.github.raw+json'},cache:'no-store'})})
.then(function(r){if(!r.ok)throw Error('Đọc dữ liệu lỗi '+r.status);return r.text()}).then(function(t){db=JSON.parse(t);if(!db||typeof db!='object'||Array.isArray(db)||!Array.isArray(db.equips))throw Error('mecha-studio.json trên GitHub không đúng định dạng — không ghi gì cả.');mut(db);
return fetch(api,{method:'PUT',headers:Object.assign({'Content-Type':'application/json'},H),body:JSON.stringify({message:msg,content:VG.b64(JSON.stringify(db,null,1)),branch:c.branch,sha:sha})})})
.then(function(r){return r.json().then(function(j){if(!r.ok)throw Error(r.status==409?'Dữ liệu trên GitHub vừa bị thay đổi nơi khác, hãy thử lại.':((j&&j.message)||('Ghi lỗi '+r.status)));return{db:db,res:j}})})}
function cm(j){return j&&j.commit?' (commit '+String(j.commit.sha).slice(0,7)+')':''}
function editBar(){var h='<div class="row" style="margin-bottom:8px"><button class="btn'+(em?'':' g')+'" id="em">✏️ '+(em?'Thoát chỉnh sửa':'Chỉnh sửa')+'</button>'+(em?'<button class="btn" id="ea">＋ Thêm trang bị</button>':'')+'</div>';
if(em)h+='<div class="mu" style="margin-bottom:8px">Thêm / xóa trang bị ghi thẳng vào <b>database/mecha-studio.json</b> trên GitHub (cần token), các dữ liệu khác giữ nguyên. Đang xem: '+esc(srcTxt)+'</div>';
if(lm)h+='<div style="margin-bottom:8px">'+lm+'</div>';if(em&&fa)h+=addForm();return h}
function addForm(){var o=fa,ex=[],sl=BASESLOTS.slice(),wc=Array.isArray(LIB.wcats)?LIB.wcats:[];(LIB.equips||[]).forEach(function(i){if(i.slot&&i.slot!='pet'&&i.slot!='drone'&&sl.indexOf(i.slot)<0)sl.push(i.slot)});
function ni(id,t,v){return '<div><div class="mu">'+t+'</div><input type="number" step="any" id="'+id+'" value="'+esc(v)+'"></div>'}
return '<div class="card" id="ef"><h2>➕ Thêm trang bị mới</h2><div class="row"><div style="flex:2"><div class="mu">Tên *</div><input id="ef_name" value="'+esc(o.name)+'"></div><div><div class="mu">Ô trang bị</div><select id="ef_slot">'+sl.map(function(x){return '<option value="'+esc(x)+'"'+(o.slot==x?' selected':'')+'>'+esc(sn(x))+'</option>'}).join('')+'<option value="__c"'+(o.slot=='__c'?' selected':'')+'>＋ Loại ô mới…</option></select></div></div>'+
'<div class="mu" style="margin-top:6px">Tên loại ô mới (chỉ dùng khi chọn “Loại ô mới”)</div><input id="ef_cus" value="'+esc(o.custom)+'" placeholder="vd: Vòng cổ">'+
'<div class="row" style="margin-top:8px">'+ni('ef_hp','+ HP',o.hp)+ni('ef_atk','+ Tấn công',o.atk)+ni('ef_spd','+ Tốc độ',o.spd)+ni('ef_sh','+ Lá chắn',o.shield)+'</div>'+
'<div class="row" style="margin-top:8px"><div><div class="mu">Loại vũ khí (vũ khí/găng)</div><select id="ef_wt">'+WT.map(function(x){return '<option value="'+x[0]+'"'+(o.wtype==x[0]?' selected':'')+'>'+x[1]+'</option>'}).join('')+'</select></div>'+(wc.length?'<div><div class="mu">Danh mục vũ khí</div><select id="ef_wc"><option value="">—</option>'+wc.map(function(x){return '<option value="'+esc(x.id)+'"'+(o.wcat==x.id?' selected':'')+'>'+esc(x.name)+'</option>'}).join('')+'</select></div>':'')+'</div>'+
'<div class="row" style="margin-top:8px">'+ni('ef_ms','Thuần thục % (găng)',o.mastery)+ni('ef_mv','Di chuyển địa hình (giày)',o.move)+'</div>'+
'<div class="row" style="margin-top:8px;align-items:center;flex-wrap:nowrap"><div id="ef_pv" style="flex:0 0 56px;min-width:0">'+(faImg?'<img class="thumb" src="'+esc(faImg)+'" alt="">':'')+'</div><div style="min-width:0"><div class="mu">Ảnh (tuỳ chọn, tự thu nhỏ)</div><input type="file" id="ef_img" accept="image/*"></div></div>'+
'<div class="mu" style="margin-top:6px">Pet / Drone (có công thức, skill) vẫn thêm bằng Mecha Studio.</div><div class="row" style="margin-top:10px"><button class="btn" id="efs">Thêm vào database</button><button class="btn g" id="efc">Hủy</button></div></div>'}
function rdAdd(){var n=function(i){return +gv(i)||0};return{name:gv('ef_name').trim(),slot:gv('ef_slot'),custom:gv('ef_cus').trim(),hp:n('ef_hp'),atk:n('ef_atk'),spd:n('ef_spd'),shield:n('ef_sh'),wtype:gv('ef_wt'),wcat:gv('ef_wc'),mastery:n('ef_ms'),move:n('ef_mv')}}
function eSave(){var o=rdAdd(),slot=o.slot=='__c'?o.custom:o.slot,err='',obj,tk;
if(!o.name)err='Chưa nhập tên trang bị.';else if(o.slot=='__c'&&!o.custom)err='Chưa nhập tên loại ô mới.';else if(/^(pet|drone)$/i.test(slot))err='Pet / Drone thêm bằng Mecha Studio.';
if(err){lm='<span class="er">❌ '+esc(err)+'</span>';fa=o;r2();return}
if(!confirm('Thêm trang bị "'+o.name+'" (ô: '+sn(slot)+') vào database/mecha-studio.json trên GitHub?'))return;
tk=etok();if(!tk)return;
obj={id:euid(),name:o.name,slot:slot,hp:o.hp,atk:o.atk,spd:o.spd,shield:o.shield,wtype:o.wtype,mastery:o.mastery,move:o.move,dtype:''};if(faImg)obj.img=faImg;if(slot=='weapon'&&o.wcat)obj.wcat=o.wcat;
fa=o;lm='Đang ghi lên GitHub…';r2();
ghPatch(function(db){if(db.equips.some(function(x){return x.slot==slot&&String(x.name).trim()==o.name}))throw Error('Đã có trang bị tên "'+o.name+'" trong ô này.');while(db.equips.some(function(x){return x.id==obj.id}))obj.id=euid();db.equips.push(obj)},'Thư viện: thêm trang bị '+o.name)
.then(function(r){LIB=r.db;srcTxt='GitHub (vừa cập nhật)';fa=null;faImg='';sel=obj.id;lm='<span class="ok">✅ Đã thêm "'+esc(o.name)+'" vào database trên GitHub'+cm(r.res)+'.</span>';r2();r1()})
.catch(function(e){lm='<span class="er">❌ Thất bại, database không bị thay đổi: '+esc(gerr3(e))+'</span>';r2()})}
function eDel(){var it=find(sel),id,nm2,slot;if(!it)return;id=it.id;nm2=it.name||id;slot=it.slot;
if(!confirm('Xóa "'+nm2+'" khỏi database/mecha-studio.json trên GitHub? Chỉ khôi phục được qua lịch sử commit.'))return;if(!etok())return;
lm='Đang ghi lên GitHub…';r2();
ghPatch(function(db){var i=db.equips.findIndex(function(x){return x.id==id});if(i<0)throw Error('Không thấy mục này trong database trên GitHub (có thể đã bị xóa).');db.equips.splice(i,1)},'Thư viện: xóa trang bị '+nm2)
.then(function(r){LIB=r.db;srcTxt='GitHub (vừa cập nhật)';if(EQ[slot]==id){delete EQ[slot];sv('vg_equip2',EQ)}['pet','drone'].forEach(function(k){if(PD[k]==id)delete PD[k]});sv('vg_pd',PD);sel=null;lm='<span class="ok">✅ Đã xóa "'+esc(nm2)+'" khỏi database trên GitHub'+cm(r.res)+'.</span>';r2();r1()})
.catch(function(e){lm='<span class="er">❌ Thất bại, database không bị thay đổi: '+esc(gerr3(e))+'</span>';r2()})}
$('v2').addEventListener('click',function(ev){var t=ev.target;if(t.id=='em'){em=!em;fa=null;lm='';r2()}else if(t.id=='ea'){fa={name:'',slot:BASESLOTS[0],custom:'',hp:0,atk:0,spd:0,shield:0,wtype:'',wcat:'',mastery:0,move:0};faImg='';lm='';r2();var x=$('ef');if(x)x.scrollIntoView({block:'start'})}else if(t.id=='efc'){fa=null;lm='';r2()}else if(t.id=='efs')eSave();else if(t.id=='edel')eDel()});
