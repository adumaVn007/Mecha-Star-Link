<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0a1117">
<meta name="robots" content="noindex,nofollow">
<title>Vân Giáp · Chỉnh sửa Bản đồ Thế giới</title>
<style>
:root{--bg:#0a1117;--p1:#263e47;--p2:#14242d;--gold:#e4c27b;--bronze:#98794b;--txt:#f3e7c9;--mut:#aab8b7;--jade:#77c5a6;--sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;overflow:hidden;overscroll-behavior:none;background:var(--bg);color:var(--txt);font:13px/1.35 Georgia,"Noto Serif",serif;user-select:none;-webkit-user-select:none}
#map{position:fixed;inset:0;width:100%;height:100%;touch-action:none;background:radial-gradient(ellipse at 50% 20%,#304b53,#0a1117 75%)}
.hud{position:fixed;z-index:5}
.pill{background:#101d22ee;border:1px solid var(--bronze);border-radius:18px;padding:4px 10px;font-size:12px;box-shadow:0 1px 6px #0008}
#top{top:calc(6px + var(--sat));left:6px;right:6px;display:flex;gap:6px;align-items:center;pointer-events:none}
#top>*{pointer-events:auto}
#info{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--gold)}
button,.btn{font:inherit;color:var(--gold);background:#101d22f2;border:1px solid #8d754b;border-radius:8px;padding:6px 10px;cursor:pointer;min-height:38px}
button:active{background:#263e47}
button.pri{background:#2f7d6f;color:#fff;border-color:#77c5a6}button.dng{color:#ff9c90;border-color:#a55}
#tools{left:0;right:0;bottom:0;padding:6px 6px calc(6px + var(--sab));background:linear-gradient(0deg,#0a1117f5,#0a1117cc);border-top:1px solid var(--bronze);display:flex;gap:5px;overflow-x:auto;scrollbar-width:none}
#tools::-webkit-scrollbar{display:none}
#tools button{flex:none;min-width:54px;display:flex;flex-direction:column;align-items:center;gap:1px;padding:4px 6px}
#tools button em{font-style:normal;font-size:18px;line-height:1.1}#tools button small{font-size:9px;color:var(--mut)}
#tools button.on{background:#2f7d6f;border-color:#8fe3cf}#tools button.on small{color:#fff}
#panel{left:6px;right:6px;bottom:calc(66px + var(--sab));max-height:40vh;overflow:auto;background:linear-gradient(145deg,#263e47f2,#14242df2);border:1px solid var(--bronze);border-radius:10px;padding:8px 10px;display:none;box-shadow:0 2px 12px #000a}
#panel.show{display:block}
#panel h4{margin:0 0 5px;color:var(--gold);font-size:13px}
.chips{display:flex;flex-wrap:wrap;gap:5px;margin:4px 0}
.chip{display:flex;align-items:center;gap:5px;padding:5px 8px;border:1px solid #6b5a3c;border-radius:16px;background:#101d22;cursor:pointer;font-size:12px;min-height:34px}
.chip.on{border-color:#8fe3cf;background:#2f5a52;box-shadow:0 0 0 1px #8fe3cf55}
.sw{width:14px;height:14px;border-radius:4px;border:1px solid #0008;flex:none}
.hint{color:var(--mut);font-size:11px;margin:3px 0}
input[type=text],input[type=number],textarea,select{width:100%;font:inherit;color:var(--txt);background:#0d171d;border:1px solid #6b5a3c;border-radius:7px;padding:7px 8px;user-select:text;-webkit-user-select:text}
textarea{min-height:48px;resize:vertical}
label.f{display:block;margin:5px 0 2px;color:var(--mut);font-size:11px}
.row2{display:flex;gap:6px}.row2>*{flex:1}
#mm{right:6px;top:calc(52px + var(--sat));border:1px solid var(--gold);background:#0a1117;width:84px;height:168px;border-radius:4px;display:none;z-index:4;touch-action:none}
#ovl{position:fixed;inset:0;z-index:20;background:#000a;display:none;align-items:center;justify-content:center;padding:10px}
#ovl.show{display:flex}
.box{width:100%;max-width:560px;max-height:100%;overflow:auto;padding:12px 14px;background:linear-gradient(145deg,#263e47,#101d25);border:1px solid var(--gold);border-radius:12px;box-shadow:0 8px 30px #000c}
.box h2{margin:0 0 8px;color:var(--gold);font-size:16px}
.acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px;justify-content:flex-end}
.slot{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid #ffffff14}
.slot canvas,.slot img{width:44px;height:44px;flex:none;background:#0d171d;border:1px solid #6b5a3c;border-radius:6px;object-fit:contain}
.slot .nm{flex:1;min-width:0}.slot .nm b{display:block;font-size:12px}.slot .nm small{color:var(--mut);font-size:10px}
.slot button{padding:4px 8px;min-height:32px;font-size:11px}
.sec{color:var(--jade);margin:10px 0 2px;font-size:12px;letter-spacing:.05em}
#toast{position:fixed;left:50%;top:calc(52px + var(--sat));transform:translateX(-50%);z-index:30;background:#101d22f2;border:1px solid var(--gold);border-radius:10px;padding:7px 14px;opacity:0;pointer-events:none;transition:opacity .2s;max-width:80vw;text-align:center}
#toast.show{opacity:1}
.ok{color:#8fe3cf}.bad{color:#ff9c90}
</style>
</head>
<body>
<canvas id="map"></canvas>
<canvas id="mm" class="hud"></canvas>
<div id="top" class="hud"><div id="info" class="pill">Đang tải…</div><button id="bMM">🗺</button><button id="bGrid">▦</button><button id="bData" class="pri">💾 Dữ liệu</button></div>
<div id="panel" class="hud"></div>
<div id="tools" class="hud"></div>
<div id="toast"></div>
<div id="ovl"><div class="box" id="box"></div></div>
<script src="vg-github.js"></script>
<script src="worldmap-gen.js"></script>
<script>
(function(){
'use strict';
var $=function(s){return document.querySelector(s)},WM=window.WM,VG=window.VG||{cfg:{writable:[]}};
var TW=64,TH=32,PATHS={map:'database/worldmap.json',assets:'database/worldmap-assets.json'},DRAFT='vg_wm_draft_v1';
if(VG.cfg&&VG.cfg.writable){VG.cfg.writable.push(PATHS.map,PATHS.assets)}
var cv=$('#map'),g=cv.getContext('2d'),mm=$('#mm'),mg=mm.getContext('2d');
var M=null,assets={},imgs={},cw=0,ch=0,dpr=1,zoom=.5,cam={x:0,y:0},grid=false,showMM=false;
var tool='pan',opt={terrain:'grass',country:1,brush:1,kind:'city',name:'',deco:'tree',landOnly:true};
var sel=null,moveMode=false,hover=null,tapTile=null,undo=[],stroke=null,pidx={},dirty=true,base=null,bctx=null;
var esc=function(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})};
var tt=0;function toast(s){var t=$('#toast');t.textContent=s;t.classList.add('show');clearTimeout(tt);tt=setTimeout(function(){t.classList.remove('show')},2200)}
function redraw(){dirty=true}
var shade=function(hex,k){var n=parseInt(hex.slice(1),16),f=function(v){return Math.max(0,Math.min(255,Math.round(v*k)))};return'rgb('+f(n>>16)+','+f((n>>8)&255)+','+f(n&255)+')'};
var TER=WM.TERRAIN,OWN=function(id){return WM.COUNTRIES[id-1]};
function idx(x,y){return y*M.w+x}function inb(x,y){return x>=0&&y>=0&&x<M.w&&y<M.h}
function rebuildPidx(){pidx={};M.places.forEach(function(p){pidx[p.x+','+p.y]=p})}
var decoAt=function(x,y){for(var i=0;i<M.decos.length;i++){var d=M.decos[i];if(d.x===x&&d.y===y)return d}return null};

/* ===== Modal ===== */
function modal(title,html,btns){var b=$('#box');b.innerHTML='<h2>'+esc(title)+'</h2>'+html+'<div class="acts" id="macts"></div>';var a=$('#macts');(btns||[{t:'Đóng'}]).forEach(function(x){var e=document.createElement('button');e.textContent=x.t;if(x.c)e.className=x.c;e.onclick=function(){if(x.keep!==true)closeModal();if(x.f)x.f()};a.appendChild(e)});$('#ovl').classList.add('show')}
function closeModal(){$('#ovl').classList.remove('show')}
function confirmBox(msg,yes,label){modal('Xác nhận','<p>'+msg+'</p>',[{t:'Hủy'},{t:label||'Đồng ý',c:'pri',f:yes}])}
function notice(ok,title,msg){modal((ok?'✔ ':'✖ ')+title,'<p class="'+(ok?'ok':'bad')+'">'+msg+'</p>')}

/* ===== Undo ===== */
function begin(){stroke=[]}
function end(){if(stroke&&stroke.length){undo.push(stroke);if(undo.length>40)undo.shift();autosave()}stroke=null}
function rec(o){if(stroke)stroke.push(o)}
function doUndo(){var s=undo.pop();if(!s){toast('Không còn gì để hoàn tác');return}
 for(var i=s.length-1;i>=0;i--){var o=s[i];
  if(o.k==='t'){M.tiles[o.i]=o.old;refreshPx(o.i%M.w,(o.i/M.w)|0)}
  else if(o.k==='o'){M.owner[o.i]=o.old;refreshPx(o.i%M.w,(o.i/M.w)|0)}
  else if(o.k==='dadd'){var j=M.decos.indexOf(o.d);if(j>=0)M.decos.splice(j,1)}
  else if(o.k==='ddel'){M.decos.push(o.d)}
  else if(o.k==='padd'){var j2=M.places.indexOf(o.p);if(j2>=0)M.places.splice(j2,1);if(sel&&sel.p===o.p)sel=null}
  else if(o.k==='pdel'){M.places.push(o.p)}
  else if(o.k==='pedit'){Object.keys(o.p).forEach(function(k){delete o.p[k]});Object.assign(o.p,o.before)}
  else if(o.k==='snap'){M.tiles=o.tiles;M.owner=o.owner;M.places=o.places;M.decos=o.decos;M.spawn=o.spawn;sel=null;buildBase()}
  else if(o.k==='spawn'){M.spawn=o.old}}
 rebuildPidx();renderPanel();redraw();toast('Đã hoàn tác')}

/* ===== Ảnh nền thu nhỏ (1 điểm ảnh / ô) ===== */
function hex2rgb(h){var n=parseInt(h.slice(1),16);return[n>>16,(n>>8)&255,n&255]}
function pxColor(x,y){var i=idx(x,y),t=TER[M.tiles[i]]||TER[0],c=hex2rgb(t.col),o=M.owner[i],n=((x*73856093^y*19349663)&15)-8;
 var r=c[0]+n,gg=c[1]+n,b=c[2]+n;
 if(o){var oc=hex2rgb(OWN(o).color),edge=false,nb=[[1,0],[-1,0],[0,1],[0,-1]];
  for(var k=0;k<4;k++){var a=x+nb[k][0],bb=y+nb[k][1];if(!inb(a,bb)||M.owner[idx(a,bb)]!==o){edge=true;break}}
  var m=edge?.85:.22;r=r*(1-m)+oc[0]*m;gg=gg*(1-m)+oc[1]*m;b=b*(1-m)+oc[2]*m}
 return'rgb('+(r|0)+','+(gg|0)+','+(b|0)+')'}
function buildBase(){base=document.createElement('canvas');base.width=M.w;base.height=M.h;bctx=base.getContext('2d');
 for(var y=0;y<M.h;y++)for(var x=0;x<M.w;x++){bctx.fillStyle=pxColor(x,y);bctx.fillRect(x,y,1,1)}redraw()}
function refreshPx(x,y){if(!bctx)return;[[0,0],[1,0],[-1,0],[0,1],[0,-1]].forEach(function(d){var a=x+d[0],b=y+d[1];if(inb(a,b)){bctx.fillStyle=pxColor(a,b);bctx.fillRect(a,b,1,1)}});redraw()}

/* ===== Hệ tọa độ isometric (giống index.html: TW=64, TH=32) ===== */
var wx=function(x,y){return(x-y)*TW/2},wy=function(x,y){return(x+y)*TH/2};
var sx=function(v){return cw/2+(v-cam.x)*zoom},sy=function(v){return ch/2+(v-cam.y)*zoom};
function tileAt(px,py){var a=((px-cw/2)/zoom+cam.x)/(TW/2),b=((py-ch/2)/zoom+cam.y-TH/2)/(TH/2);
 var x=Math.round((a+b)/2),y=Math.round((b-a)/2);return inb(x,y)?{x:x,y:y}:null}
function zoomAt(px,py,f){var ax=(px-cw/2)/zoom+cam.x,ay=(py-ch/2)/zoom+cam.y;zoom=Math.max(.12,Math.min(3,zoom*f));cam.x=ax-(px-cw/2)/zoom;cam.y=ay-(py-ch/2)/zoom;redraw()}
function center(x,y){cam.x=wx(x,y);cam.y=wy(x,y)+TH/2;redraw()}
function resize(){dpr=Math.min(window.devicePixelRatio||1,2.5);cw=cv.clientWidth;ch=cv.clientHeight;cv.width=Math.round(cw*dpr);cv.height=Math.round(ch*dpr);redraw()}

/* ===== Vẽ 2.5D thủ tục (có thể thay bằng ảnh ở công cụ Đồ họa) ===== */
function dia(c,px,py,w,h){c.beginPath();c.moveTo(px,py);c.lineTo(px+w,py+h);c.lineTo(px,py+2*h);c.lineTo(px-w,py+h);c.closePath()}
function poly(c,pts,fill,stroke){c.beginPath();c.moveTo(pts[0],pts[1]);for(var i=2;i<pts.length;i+=2)c.lineTo(pts[i],pts[i+1]);c.closePath();if(fill){c.fillStyle=fill;c.fill()}if(stroke){c.strokeStyle=stroke;c.lineWidth=1;c.stroke()}}
function blk(c,cx,cy,hw,hg,col){var hh=hw/2,T=cy-hg;
 poly(c,[cx-hw,T,cx,T+hh,cx,cy+hh,cx-hw,cy],shade(col,.6));poly(c,[cx+hw,T,cx,T+hh,cx,cy+hh,cx+hw,cy],shade(col,.8));poly(c,[cx,T-hh,cx+hw,T,cx,T+hh,cx-hw,T],col,'#0003')}
function roof(c,cx,cy,hw,rise,col){var hh=hw/2;poly(c,[cx-hw,cy,cx,cy+hh,cx,cy-rise],shade(col,.65));poly(c,[cx+hw,cy,cx,cy+hh,cx,cy-rise],shade(col,.9));poly(c,[cx-hw,cy,cx,cy-hh,cx+hw,cy,cx,cy-rise],col,'#0003')}
function glow(c,x,y,r,col){var gr=c.createRadialGradient(x,y,0,x,y,r);gr.addColorStop(0,col+'cc');gr.addColorStop(1,col+'00');c.fillStyle=gr;c.beginPath();c.arc(x,y,r,0,7);c.fill()}
function shadow(c,cx,cy,rx){c.fillStyle='#0006';c.beginPath();c.ellipse(cx,cy+2,rx,rx/2,0,0,7);c.fill()}
var DRAW={
 tree:function(c,x,y,z){shadow(c,x,y,9*z);c.fillStyle='#4a3a28';c.fillRect(x-1.6*z,y-8*z,3.2*z,9*z);
  var k=[['#245a43',-12,10],['#2f7358',-17,8],['#3d8a6a',-21,5.5]];k.forEach(function(a){var gr=c.createRadialGradient(x-2*z,y+a[1]*z-2*z,1,x,y+a[1]*z,a[2]*z+2);gr.addColorStop(0,shade('#5fae8a',1.1));gr.addColorStop(1,a[0]);c.fillStyle=gr;c.beginPath();c.ellipse(x,y+a[1]*z,a[2]*z+1*z,a[2]*z,0,0,7);c.fill()})},
 pine:function(c,x,y,z){shadow(c,x,y,8*z);c.fillStyle='#4a3a28';c.fillRect(x-1.4*z,y-5*z,2.8*z,6*z);
  [[-4,11,'#1f4d3c'],[-12,9,'#28604a'],[-20,6.5,'#327558']].forEach(function(a){poly(c,[x-a[1]*z,y+a[0]*z,x,y+(a[0]-12)*z,x,y+(a[0]+3)*z],shade(a[2],.7));poly(c,[x+a[1]*z,y+a[0]*z,x,y+(a[0]-12)*z,x,y+(a[0]+3)*z],a[2])})},
 peak:function(c,x,y,z){shadow(c,x,y,17*z);poly(c,[x-17*z,y,x-3*z,y-30*z,x+2*z,y+4*z],'#5b605d');poly(c,[x+17*z,y,x-3*z,y-30*z,x+2*z,y+4*z],'#868b87');poly(c,[x-3*z,y-30*z,x-8*z,y-19*z,x-3*z,y-22*z,x+2*z,y-17*z,x+4*z,y-21*z],'#eef4f2')},
 boulder:function(c,x,y,z){shadow(c,x,y,10*z);poly(c,[x-10*z,y,x-6*z,y-10*z,x+1*z,y-12*z,x+4*z,y+3*z],'#5f645f');poly(c,[x+1*z,y-12*z,x+9*z,y-6*z,x+10*z,y,x+4*z,y+3*z],'#8b908b');poly(c,[x-6*z,y-10*z,x+1*z,y-12*z,x-1*z,y-5*z],'#a3a8a2')},
 crystal:function(c,x,y,z){shadow(c,x,y,8*z);glow(c,x,y-9*z,16*z,'#7fe8ff');poly(c,[x-5*z,y,x-4*z,y-14*z,x,y-20*z,x,y+2*z],'#3aa6c7');poly(c,[x+5*z,y,x+4*z,y-14*z,x,y-20*z,x,y+2*z],'#8ff0ff');poly(c,[x+3*z,y,x+8*z,y-8*z,x+6*z,y+1*z],'#5bc7e0')},
 pagoda:function(c,x,y,z){shadow(c,x,y,13*z);blk(c,x,y,12*z,3*z,'#8a8a82');blk(c,x,y-3*z,7*z,8*z,'#8a6a3c');roof(c,x,y-11*z,11*z,6*z,'#2f7d6f');blk(c,x,y-17*z,5*z,6*z,'#8a6a3c');roof(c,x,y-23*z,8*z,5*z,'#2f7d6f');c.fillStyle='#e4c27b';c.fillRect(x-.8*z,y-34*z,1.6*z,6*z)},
 tent:function(c,x,y,z){shadow(c,x,y,12*z);poly(c,[x-12*z,y,x,y-16*z,x-1*z,y+5*z],'#a58a5a');poly(c,[x+12*z,y,x,y-16*z,x-1*z,y+5*z],'#d2b57d');poly(c,[x-3*z,y+4*z,x,y-3*z,x+2*z,y+3*z],'#3a2a1a')},
 ruinpil:function(c,x,y,z){shadow(c,x,y,8*z);c.fillStyle='#8a7a5c';c.fillRect(x-4*z,y-14*z,8*z,15*z);c.fillStyle='#b8a67f';c.fillRect(x-4*z,y-14*z,3.5*z,15*z);poly(c,[x-4*z,y-14*z,x-1*z,y-17*z,x+1*z,y-12*z,x+4*z,y-15*z,x+4*z,y-14*z],'#6e6048');c.fillStyle='#6e6048';c.fillRect(x+6*z,y-3*z,6*z,4*z)},
 chest:function(c,x,y,z){shadow(c,x,y,8*z);blk(c,x,y,7*z,6*z,'#8a5a2c');c.fillStyle='#e4c27b';c.fillRect(x-1*z,y-3*z,2*z,3*z)},
 banner:function(c,x,y,z){shadow(c,x,y,5*z);c.fillStyle='#4a3a28';c.fillRect(x-1*z,y-26*z,2*z,28*z);poly(c,[x+1*z,y-26*z,x+14*z,y-22*z,x+1*z,y-14*z],'#c0392b');c.fillStyle='#e4c27b';c.fillRect(x-2*z,y-28*z,4*z,3*z)},
 lotus:function(c,x,y,z){c.fillStyle='#2f6a4a';c.beginPath();c.ellipse(x,y-1*z,11*z,5*z,0,0,7);c.fill();for(var i=-1;i<=1;i++)poly(c,[x+i*4*z-3*z,y-2*z,x+i*4*z,y-10*z,x+i*4*z+3*z,y-2*z],i?'#e8a6c0':'#f6c9da')},
 spring:function(c,x,y,z){glow(c,x,y-2*z,18*z,'#7fe8ff');c.fillStyle='#3a8fb0';c.beginPath();c.ellipse(x,y,11*z,5.5*z,0,0,7);c.fill();c.strokeStyle='#d6f6ff';c.lineWidth=1.2*z;c.beginPath();c.ellipse(x,y,6*z,3*z,0,0,7);c.stroke()}
};
var KDRAW={

$('#bGrid').onclick=function(){grid=!grid;redraw();toast(grid?'Bật lưới ô (zoom ≥ 0.8)':'Tắt lưới ô')};
$('#bData').onclick=dataModal;
$('#ovl').addEventListener('pointerdown',function(e){if(e.target===$('#ovl')&&$('#box').querySelector('#dUp')===null&&false)closeModal()});
window.addEventListener('resize',resize);
window.addEventListener('keydown',function(e){if(e.target.tagName==='INPUT'||e.target.tagName==='TEXTAREA')return;if((e.ctrlKey||e.metaKey)&&e.key==='z'){doUndo();e.preventDefault()}});
window.addEventListener('beforeunload',function(e){if(undo.length){e.preventDefault();e.returnValue=''}});
window.__WM_TEST={get M(){return M},draw:draw,tileAt:tileAt,setTool:setTool,onTap:onTap,get cam(){return cam},get zoom(){return zoom},set zoom(v){zoom=v}};

/* ===== Khởi động ===== */
function start(){
 buildTools();setTool('pan');resize();loop();
 loadRemote(false).catch(function(){var m=WM.generate(20261124);M=m;rebuildPidx();buildBase();toast('Chưa có worldmap.json trên GitHub — đã tạo bản random mới')}).then(function(){
  if(!M)return;center(M.spawn.x,M.spawn.y);zoom=.6;redraw();$('#info').textContent='Bản đồ '+M.w+'×'+M.h+' · chạm ô để xem';
  try{var d=JSON.parse(localStorage.getItem(DRAFT)||'null');if(d&&d.map&&d.map.tiles){confirmBox('Có <b>bản nháp chưa lưu lên GitHub</b> ('+new Date(d.t).toLocaleString('vi-VN')+'). Khôi phục bản nháp?',function(){M=WM.fromJSON(d.map);M.legacyZone=d.map.legacyZone;assets=d.assets||{};rebuildPidx();buildBase();center(M.spawn.x,M.spawn.y);renderPanel()},'Khôi phục')}}catch(e){}})}
start();
})();
</script>
